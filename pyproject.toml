[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-ocr-synthetic"
version = "0.1.0"
description = "Synthetic document generation for VLM/OCR training, with pluggable render backends"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Python 3.14 needs higher floors than older interpreters: below these
# versions there is no cp314 wheel, so pip falls back to a source build that
# fails or takes minutes. See vlm_ocr_synthetic/compat.py for the evidence
# behind each floor -- that module and these pins must stay in sync.
dependencies = [
    "pydantic>=2.0; python_version < '3.14'",
    "pydantic>=2.12; python_version >= '3.14'",
    "PyYAML>=6.0; python_version < '3.14'",
    "PyYAML>=6.0.3; python_version >= '3.14'",
]

[project.optional-dependencies]
synthdog = [
    "Pillow>=10.0; python_version < '3.14'",
    "Pillow>=11.3; python_version >= '3.14'",
]
html = [
    "Pillow>=10.0; python_version < '3.14'",
    "Pillow>=11.3; python_version >= '3.14'",
    "Jinja2>=3.1",
    "playwright>=1.40; python_version < '3.14'",
    "playwright>=1.52; python_version >= '3.14'",
]
dev = ["pytest>=7.0", "ruff>=0.6"]
all = [
    "vlm-ocr-synthetic[synthdog,html,dev]",
]

[project.scripts]
vlm-ocr-synthetic = "vlm_ocr_synthetic.cli:main"

[tool.setuptools.packages.find]
include = ["vlm_ocr_synthetic*"]

[tool.setuptools.package-data]
"vlm_ocr_synthetic.renderers.html" = ["templates/*.j2"]

[tool.ruff]
line-length = 90
target-version = "py310"
extend-exclude = ["data", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are the formatter's business, not the linter's
    "B008",    # Depends()-style defaults are fine here
    "SIM108",  # ternaries are not always clearer
    "B905",    # zip(strict=) -- several zips here are intentionally ragged
    "RUF046",  # int(round(x)) is explicit about the pixel rounding we mean
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into privates on purpose, and import inside functions to keep
# optional dependencies optional.
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["vlm_ocr_synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
markers = [
    "slow: renders through a real backend (browser / rasteriser)",
]
