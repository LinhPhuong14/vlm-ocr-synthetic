# This repository is a collection of generators, not an installable package:
# each renderer under generators/ has its own dependencies and its own supported
# Python range. What lives here is the tooling configuration shared across them.
# The first-party packages (rulebase, degradation, pipeline) live in `src/` and
# are imported from the path, never installed.

[tool.ruff]
line-length = 90
# synthdog targets Python 3.8, so ruff must not suggest newer syntax --
# `zip(strict=)` and friends would break the environment it actually runs in.
target-version = "py38"
# Vendored third-party code keeps its own style. `generators/genalog/` is only
# partly vendored -- render.py, templates/ and README.md are ours -- so the
# upstream tree is named rather than the whole directory. Keep this list in step
# with VENDORED in tools/paths.py, which is what `tasks.py check` uses.
extend-exclude = [
    "generators/genalog/genalog",
    ".venv*",
]

[tool.ruff.lint]
# Correctness and imports; not a style crusade over code adapted from upstream.
select = ["E", "F", "I"]
ignore = [
    "E501",  # long lines
    "E731",  # assigned lambdas read fine in the layout helpers
]

[tool.ruff.lint.per-file-ignores]
# Kept close to clovaai/donut so upstream changes still merge cleanly.
"generators/synthdog/template.py" = ["F841"]

[tool.pytest.ini_options]
# `pythonpath` so `import rulebase` works without installing the package, and
# so `conftest.py` helpers are importable by name from the test modules. The
# first-party packages live in `src/`; `.` is still needed for `tasks.py`.
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
# No `-x`: stopping at the first failure hides every later one, and the whole
# point of a suite this small is seeing the full picture in one run.
addopts = "-q --strict-markers"
# `slow` is for the tests that build real images through a renderer venv. They
# are the only ones that can prove a claim about pixels, so they are part of
# the suite rather than something to remember to run; `-m "not slow"` skips
# them when the renderers are not built.
markers = [
    "slow: renders through a real backend; needs that renderer's virtualenv",
]
