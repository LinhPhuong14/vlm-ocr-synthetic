  # ------------------------------------------------------------------
  # Mười phôi của root "Invoice / Billing" (docs/root-document-taxonomy.md
  # §3.1) — không đo từ MỘT ảnh cụ thể như các phôi trên, mà từ khảo sát
  # nhiều mẫu hoá đơn bán hàng tự thiết kế phổ biến cho từng kiểu bố cục;
