    sheet: samples/invoice-templates/invoice_hotel_compact.html

  invoice_hotel_stay:
    source: "ảnh hoá đơn một khu nghỉ dưỡng, số INV001421, đặt qua kênh trực tuyến"
    layout: invoice_hotel_stay
    sheet: samples/invoice-templates/invoice_hotel_stay.html

  invoice_power:
    source: "ảnh hoá đơn Tổng công ty Điện lực TP HCM, Điện lực Tân Thuận, 01/2021"
    layout: invoice_power
    sheet: null

  invoice_tax_en:
    source: "photo of an Australian tax invoice, ABN 1234, invoiced 28/06/2017"
    layout: invoice_tax_en
    sheet: null

  invoice_vat_form:
    source: "ảnh mẫu hoá đơn GTGT ký hiệu 1K22DAA số 6830, và mẫu có dấu HOÁ ĐƠN MẪU"
    layout: invoice_vat_form
    sheet: null

  invoice_vat_summary:
    source: "ảnh hoá đơn GTGT mẫu 01GTKT0/001, ký hiệu AA/18E, của một chuỗi bán lẻ"
    layout: invoice_vat_summary
    sheet: samples/invoice-templates/invoice_vat_summary.html

  invoice_water:
    source: "ảnh hoá đơn Công ty TNHH MTV Nước sạch Hà Nội, ký hiệu 1K25TAE, tháng 01/2025"
    layout: invoice_water
    sheet: null

  market_barcode:
    source: "photo VinCommerce / VM Royal City, Hà Nội"
    layout: market_barcode
    sheet: null

  market_compact:
    source: "photo WinMart, PHIẾU TÍNH TIỀN 2025"
    layout: market_compact
    sheet: null

  market_vat:
    source: "photo Saigon Co.op, PHIẾU TÍNH TIỀN 2022"
    layout: market_vat
    sheet: null

  market_vat_b:
    source: "biến thể của market_vat (sinh bằng LLM, không đo từ ảnh nào)"
    layout: market_vat_b
    sheet: null

  notebook_ledger:
    source: "sổ ghi bán hàng chép tay, tiệm tạp hoá — không có bản in nào để chụp"
    layout: notebook_ledger
    sheet: null

  medical_statement:
    source: "ảnh bảng kê 01/KBCB của một bệnh viện đa khoa, 3 trang, có dấu SAO Y BẢN CHÍNH"
    layout: medical_statement
    sheet: samples/form-templates/medical_statement.html

# Phôi mà mỗi document được phép dựng từ. Thứ tự không quan trọng.
documents:
  pub_eatery: [eatery_indexed, eatery_ascii]
  street_eatery: [eatery_indexed, eatery_ascii]
  restaurant_vat: [eatery_indexed]
  supermarket: [market_barcode, market_compact]
  convenience_store: [market_compact, notebook_ledger]
  supermarket_vat: [market_barcode, market_vat, market_vat_b]
  vat_invoice_form: [invoice_vat_form]
  utility_water: [invoice_water]
  utility_power: [invoice_power]
  tax_invoice_en: [invoice_tax_en]
  retail_vat_invoice: [invoice_vat_summary]
  export_invoice: [invoice_export]
  resort_stay: [invoice_hotel_stay, invoice_hotel_compact]
  hotel_stay: [invoice_hotel_stay, invoice_hotel_compact]
  bakery_order: [invoice_brand]
  hospital_bill: [medical_statement]
  authorisation_letter: [authorisation_letter]
