  utility_water: [invoice_water]
  utility_power: [invoice_power]
  tax_invoice_en: [invoice_tax_en]
  retail_vat_invoice: [invoice_vat_summary]
  export_invoice: [invoice_export]
  resort_stay: [invoice_hotel_stay, invoice_hotel_compact]
  hotel_stay: [invoice_hotel_stay, invoice_hotel_compact]
  bakery_order: [invoice_brand]
  hospital_bill: [medical_statement]
  authorisation_letter: [authorisation_letter]
  invoice_plain:
    [invoice_logo_center, invoice_dense_table,
     invoice_minimalist, invoice_multipage]
  invoice_detailed:
