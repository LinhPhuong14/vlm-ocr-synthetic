# INV-01 — Header rồi một bảng hàng chạy hết bề ngang.
#
# Đối chiếu trực tiếp với ảnh tham chiếu của chính layout này trong gallery
# (`docs/root-document-taxonomy.md` § 3.1, INV-01): một hoá đơn GTGT điện tử
# Viettel S-Invoice thật — tên/logo bên bán góc TRÁI, hộp "Mẫu số / Ký hiệu /
# Số" nhỏ góc PHẢI cùng hàng, tiêu đề canh giữa full-width ngay dưới, rồi MỘT
# khối viền bao quanh cả "Đơn vị bán hàng" (nhãn IN ĐẬM) VÀ "Người mua hàng"
# nối tiếp nhau (không tách hai hộp, không chia hai cột), sau đó một bảng
# hàng full-width đúng sáu cột, có viền đủ bốn cạnh MỖI Ô (không phải chỉ kẻ
# trên/dưới tiêu đề cột) — khớp ảnh 1:1 — rồi tổng cộng, số tiền bằng chữ,
# hai ô chữ ký, ghi chú chân trang nhỏ.
#
# Ba lượt sửa trên cùng layout này: (1) bản đầu dùng `invoice_plain`, bỏ hẳn
# khối khách hàng; (2) đổi sang `invoice_detailed` + `header.align: corner`
# để có đủ khối và đúng dáng góc trái/góc phải; (3) lượt này — soát lại ảnh
# gốc kỹ hơn, thêm viền hộp (`parties.boxed`), bảng full viền (`table.grid`),
# nhãn field in đậm (CSS `.crow .k`, không cần cờ riêng), khối "Đơn vị bán
# hàng" (`parties.seller`, xem `_seller_rows` trong modern.py) — trước layout
# này chỉ in địa chỉ/SĐT/MST/STK bên bán KHÔNG NHÃN, lẫn trong masthead; giờ
# masthead chỉ còn tên hiệu (`header.address/phone/tax_code/account/website:
# false` tắt hẳn các dòng đó ở đó), khối "Đơn vị bán hàng" đứng đầu bên trong
# CHÍNH hộp viền của khối người mua — đúng dáng ảnh gốc, một khối chứ không
# phải hai; và hai điểm trang trí `header.logo`/`page.watermark` (mới) — một
# huy hiệu tròn chữ cái đầu tên hiệu cạnh masthead, một dòng tên hiệu chéo mờ
# phía sau trang — CẢ HAI đều chữ thường (không `span()`), không phải logo/dấu
# chìm THẬT của Viettel trong ảnh tham chiếu (tránh mạo danh thương hiệu),
# chỉ đứng vào đúng CHỖ hai chi tiết đó chiếm trên trang. Hộp góc phải đã vẽ
# số/ngày của `strip` nên KHÔNG liệt `strip` riêng trong `sections:` nữa,
# giống cách `align: split` tự gộp tiêu đề.
id: invoice_header_table
name: Corner masthead, one boxed seller+buyer block, full-grid item table
source: "hoá đơn giá trị gia tăng điện tử Viettel S-Invoice (bản thể hiện) — khối bán/mua đầy đủ trước MỘT bảng hàng full-width"

width: [78, 92]
gutter: 2
rule_char: "-"
sheet: a4
rules: marks

sections: [header, parties, table, totals, words, signatures, footer]

page:
  watermark: true

header:
  align: corner
  logo: true
  name_scale: [1.30, 1.55]
  name_bold: true
  title: true
  title_scale: [1.20, 1.40]
  # Moved into the boxed seller block below (`parties.seller`) instead --
  # labelled there, unlike these lines, which never carried a label.
  address: false
  address2: false
  phone: false
  tax_code: false
  account: false
  website: false

parties:
  columns: stacked
  seller: true
  boxed: true

columns:
  - {key: stt,        title: "STT",                   width: 4,  align: center, title_align: center}
  - {key: name,       title: "Tên hàng hoá, dịch vụ",  width: 0,  align: left,   title_align: left}
  - {key: unit,       title: "ĐVT",                    width: 8,  align: center, title_align: center}
  - {key: qty,        title: "Số lượng",               width: 8,  align: right,  title_align: right}
  - {key: unit_price, title: "Đơn giá",                width: 13, align: right,  title_align: right}
  - {key: amount,     title: "Thành tiền",             width: 15, align: right,  title_align: right}

table:
  frame: false
  shade: 0.10
  header_rules: true
  grid: true

item:
  wrap_name: true
  rows:
    - - {col: stt, from: stt}
      - {col: name, from: name}
      - {col: unit, from: unit}
      - {col: qty, from: qty}
      - {col: unit_price, from: unit_price}
      - {col: amount, from: amount}

totals:
  frame: false
  indent: 0.42
  emphasise_grand: true
  grand_scale: [1.15, 1.35]
