# TẮT — không lượt chạy nào bốc bố cục này nữa.
#
# `enabled: false` là công tắc của riêng file bố cục: `rulebase.available_layouts()`
# bỏ qua nó, nên `layouts: []` trong `pipeline.yaml` (nghĩa là "mọi bố cục") và
# `per_backend: auto` đều không còn thấy nó. File VẪN ở đây, vẫn được
# `rulebase/rules/layout.yaml` khai, nên `rulebase.make(force={'layout': ...})`
# vẫn dựng lại được những trang đã commit từng vẽ bằng nó, và các test vẫn soi
# nó qua `rulebase.every_layout()`. Bật lại = xoá đúng một dòng.
#
# Đây là một trong mười bố cục của ROOT 3 (Form / Application),
# `docs/root-document-taxonomy.md` § 3.3 — cả mười tắt cùng một lượt.
enabled: false

# FORM-01 — Biểu mẫu câu hỏi đơn giản: vài trường, một đoạn mô tả, một câu
# hỏi Có/Không, một chữ ký.
#
# Dùng `form_brief` (§ xem `rulebase/documents/form_brief.yaml`) — cùng
# tài liệu với FORM-03, khác cách trình bày (không chia mục, không khối
# kép). `notes:` của tài liệu này luôn có nội dung nên PHẢI liệt "notes"
# trong sections — bỏ sót là đúng lỗi "populated but never printed".
id: form_questionnaire
name: Simple questionnaire — a few fields, a description, one signature
source: "FUNSD (R&D Quality Improvement Suggestion Form) — trường tên/ngày/quản lý, đoạn mô tả, câu hỏi Có/Không rõ ràng"
family: form

width: [78, 88]
gutter: 2
rule_char: "-"
sheet: a4
rules: marks

sections: [header, parties, notes, signatures, footer]
