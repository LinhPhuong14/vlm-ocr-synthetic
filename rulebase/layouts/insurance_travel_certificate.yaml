# GCN bảo hiểm du lịch quốc tế — dạng vé song ngữ, A4 ngang.
id: insurance_travel_certificate
name: International travel insurance certificate — bilingual ticket-style, landscape
source: "samples/insurance-templates/insurance_travel_certificate.html (LO-09)"
family: insurance
composition: travel_cert

width: [92, 104]
gutter: 2
rule_char: "-"

sheet: a4

rules: marks

sections: [letterhead, doctitle, parties, table, notes, signatures, footer]

letterhead:
  frame: false
  labels: {address: "", tax_code: "", phone: "", account: "", branch: "", form_no: "", serial: "", number: "Certificate No.:"}

parties:
  style: stacked

bilingual_left:
  - ["Full name", "Họ và tên"]
  - ["Passport no.", "Số hộ chiếu"]
  - ["Date of issue", "Ngày cấp"]
  - ["Period of insurance ends", "Hiệu lực đến ngày"]

columns:
  - {key: name, label: "Benefit · Quyền lợi", width: 0, align: left}
  - {key: amount, label: "Số tiền bảo hiểm (EUR)", width: 22, align: right}

item:
  rows:
    - - {col: name, from: name}
      - {col: amount, from: amount}
