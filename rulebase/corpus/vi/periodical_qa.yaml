# PERIODICAL_QA — sáu bộ phỏng vấn hỏi-đáp trọn vẹn, mỗi bộ là MỘT cuộc
# phỏng vấn thống nhất (giống classifieds/toc, khác kho bài rời của
# periodical_article.yaml). Không có `byline`/`footer`: tên người thực hiện
# và ảnh được bốc từ `corpus.people()` lúc dựng trang, số trang/tên tạp chí
# lấy từ dữ liệu cố định của tài liệu (`rulebase/documents/<id>.yaml`) --
# chỉ nội dung cuộc phỏng vấn mới cố định theo từng mục dưới đây.

- section: "Chân dung"
  headline: "\"Nghề này ba năm mới biết cầm đất\""
  subject_name: "Ông Út Bảy"
  subject_role: "thợ gốm cuối cùng của làng gốm Mẫu Điền · 71 tuổi"
  deck: "Làng gốm Mẫu Điền từng có hơn ba mươi lò, nay chỉ còn một. Ông Út Bảy vẫn giữ lò đỏ lửa mỗi tuần, dù không còn ai trong nhà nối nghề."
  qa:
    - question: "Vì sao làng gốm chỉ còn một lò?"
      answer: "Đất sét khai thác khó hơn trước, mà gốm công nghiệp bán rẻ hơn nhiều. Người ta bỏ nghề dần, tôi thấy tiếc nhưng không trách được ai."
    - question: "Ông có định truyền nghề cho ai không?"
      answer: "Có hai đứa cháu học được vài tháng rồi nghỉ. Tụi nó nói làm công ty lương ổn định hơn, tôi cũng hiểu."
    - question: "Vậy tại sao ông vẫn giữ lò?"
      answer: "Quen tay rồi. Với lại còn vài mối quen đặt hàng, bỏ lò là bỏ luôn mấy chục năm gắn bó."
    - question: "Nghề gốm khó nhất ở khâu nào?"
      answer: "Canh lửa. Lửa non thì gốm không chín, lửa già thì nứt hết. Cái đó không sách nào dạy được, phải đứng canh cả đêm mới quen."
    - question: "Có bao giờ ông nghĩ đến việc bán đất, nghỉ nghề chưa?"
      answer: "Nghĩ rồi, nhưng cứ đến hôm nhóm lò lại thôi. Còn lửa trong lò là còn thấy mình còn việc để làm."
    - question: "Khách hàng của ông bây giờ là ai?"
      answer: "Chủ yếu người sưu tầm với vài quán cà phê thích đồ gốm thủ công. Ít nhưng đều, đủ để lò không tắt."
    - question: "Ông có lời khuyên gì cho lớp trẻ muốn học nghề truyền thống?"
      answer: "Đừng học vì tiếc nghề của ông bà. Học vì thật sự thích, vì nghề này cực mà không giàu nhanh được."
    - question: "Nếu không còn ai học, ông tính sao với lò gốm này?"
      answer: "Tôi chưa nghĩ tới. Nhưng chắc để lại cho ai thật sự muốn giữ lửa, không nhất thiết phải là người trong nhà."
  pull_quote: "\"Còn lửa trong lò là còn thấy mình còn việc để làm.\""
  bio_rows:
    - year: "1955"
      text: "Sinh tại làng gốm Mẫu Điền, học nghề từ năm 12 tuổi"
    - year: "1974"
      text: "Bắt đầu tự đứng lò sau khi cha mất"
    - year: "1990"
