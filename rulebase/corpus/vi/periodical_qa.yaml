    - year: "2024"
      text: "Trở thành lò gốm cuối cùng còn đỏ lửa trong làng"

- section: "Nhân vật"
  headline: "\"Tôi không dạy chữ, tôi dạy tụi nhỏ tin vào mình\""
  subject_name: "Cô Tư Liên"
  subject_role: "giáo viên phổ cập, đã dạy lớp học tình thương mười tám năm"
  deck: "Lớp học tình thương của cô Tư Liên không thu học phí, nhận cả những em từng bỏ học nhiều năm. Học trò của cô, người ít tuổi nhất tám tuổi, người lớn tuổi nhất đã ngoài năm mươi."
  qa:
    - question: "Vì sao cô mở lớp học tình thương?"
      answer: "Hồi đó xóm tôi có nhiều đứa nhỏ không có giấy khai sinh, không đi học được. Tôi dạy tụi nó biết chữ trước, chuyện giấy tờ tính sau."
    - question: "Học trò lớn tuổi nhất của cô là ai?"
      answer: "Một bác năm nay ngoài năm mươi, đi học để tự đọc được đơn thuốc cho vợ. Bác học chăm hơn cả mấy đứa nhỏ."
    - question: "Cô dạy một lớp mà tuổi học trò chênh nhau vậy, có khó không?"
      answer: "Khó chứ. Nhưng tôi chia nhóm nhỏ, đứa lớn kèm đứa nhỏ. Tụi nó dạy lẫn nhau nhiều khi hiệu quả hơn tôi dạy."
    - question: "Kinh phí lớp học lấy từ đâu?"
      answer: "Ban đầu tôi tự bỏ tiền lương hưu ra mua sách vở. Sau có vài mạnh thường quân biết chuyện, giúp thêm bàn ghế với đèn."
    - question: "Có học trò nào của cô sau này học lên cao không?"
      answer: "Có hai đứa học xong lớp chín rồi thi vào trường nghề. Với tôi vậy là thành công lớn rồi."
    - question: "Cô có bao giờ định nghỉ dạy chưa?"
      answer: "Có lúc mệt, định nghỉ. Nhưng nghĩ tới tụi nhỏ không có chỗ học nữa là lại thôi, ráng dạy tiếp."
    - question: "Điều gì khiến cô vui nhất khi dạy lớp này?"
      answer: "Thấy một đứa từ chỗ không dám cầm bút, sau tự viết được tên mình. Vui hơn bất cứ chuyện gì."
  pull_quote: "\"Tụi nó dạy lẫn nhau nhiều khi hiệu quả hơn tôi dạy.\""
  bio_rows:
    - year: "1962"
      text: "Sinh ra và lớn lên tại địa phương"
    - year: "1983"
      text: "Tốt nghiệp trung cấp sư phạm, dạy tại trường tiểu học xã"
    - year: "2006"
