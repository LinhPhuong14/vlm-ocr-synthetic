    - year: "2026"
      text: "Vẫn di chuyển hơn tám mươi cây số mỗi ngày mùa khô"

- section: "Câu chuyện nghề"
  headline: "\"Sáu thùng nước mắm là sáu đứa con của tôi\""
  subject_name: "Ông Hai Thành"
  subject_role: "chủ nhà thùng nước mắm truyền thống · 66 tuổi"
  deck: "Trong lúc nhiều cơ sở giảm giá để cạnh tranh, ông Hai Thành chọn giữ nguyên giá và công khai toàn bộ quy trình ủ chượp cho khách xem tận mắt."
  qa:
    - question: "Vì sao ông không giảm giá để cạnh tranh?"
      answer: "Giảm giá thì phải rút ngắn thời gian ủ hoặc pha thêm phụ gia. Tôi không muốn làm vậy với nghề của ông bà để lại."
    - question: "Ông công khai quy trình ủ chượp để làm gì?"
      answer: "Để khách tin. Bây giờ người ta nghi ngờ đủ thứ, mình cho xem tận mắt thì họ yên tâm hơn nhiều lời quảng cáo."
    - question: "Sản lượng của nhà thùng hiện nay so với trước ra sao?"
      answer: "Chỉ còn khoảng một phần năm so với mười năm trước. Nhưng tôi không buồn, vì khách còn lại là khách thật sự cần nước mắm ngon."
    - question: "Ông có tính mở rộng quy mô sản xuất không?"
      answer: "Không. Chín thùng là vừa sức tôi coi ngó. Mở rộng thêm mà không coi kỹ được là hỏng cả mẻ."
    - question: "Ai sẽ là người nối nghề của ông?"
      answer: "Chưa biết. Con tôi đi làm ở thành phố hết. Tôi chỉ mong giữ được nghề đến khi có người trong nhà chịu học."
    - question: "Điều gì ông tự hào nhất về nghề này?"
      answer: "Mỗi giọt nước mắm rút ra đều đúng những gì tôi ủ vào, không giấu ai điều gì. Với tôi vậy là đủ tự hào."
  pull_quote: "\"Chín thùng là vừa sức tôi coi ngó. Mở rộng thêm mà không coi kỹ được là hỏng cả mẻ.\""
