- section: "Nhân vật"
  headline: "\"Ba năm là điều kiện, không phải hình thức\""
  subject_name: "Ông Tám Nghĩa"
  subject_role: "nghệ nhân sơn mài, đang dạy hai học trò trái nghề · 63 tuổi"
  deck: "Không còn ai trong làng theo nghề sơn mài, ông Tám Nghĩa nhận hai học trò từ tỉnh khác, với điều kiện họ phải ở lại làng học đủ ba năm."
  qa:
    - question: "Vì sao ông đặt điều kiện ba năm cho học trò?"
      answer: "Ba năm là thời gian tối thiểu để nắm được cách pha sơn và mài đúng độ bóng. Học nửa chừng rồi bỏ thì phí công cả hai bên."
    - question: "Học trò của ông học những gì trong ba năm đó?"
      answer: "Năm đầu chỉ pha sơn, mài lớp nền. Năm thứ hai mới được động vào vẽ hoa văn. Năm thứ ba học cách nhận biết khi nào sơn đã đủ khô để mài tiếp."
    - question: "Ông có lo học trò bỏ giữa chừng không?"
      answer: "Có lo, nhưng đã giao kèo từ đầu rồi. Nếu bỏ giữa chừng thì coi như ba năm đó họ tự học cho mình, không mất gì của tôi."
    - question: "Một sản phẩm sơn mài hoàn chỉnh mất bao lâu?"
      answer: "Ít nhất tám tháng, qua hơn mười lớp sơn, mỗi lớp phải khô hoàn toàn mới mài lớp kế tiếp."
    - question: "Ông nghĩ nghề sơn mài có giữ được ở làng này không?"
      answer: "Tôi không dám chắc. Nhưng ít nhất ba năm nữa, làng còn có người biết làm đúng cách. Vậy đã là hơn không có ai."
    - question: "Nếu hai học trò này rời làng sau ba năm, ông tính sao?"
      answer: "Thì lại tìm học trò khác. Tôi chỉ có một điều kiện, còn ai chịu học thì tôi dạy hết lòng."
