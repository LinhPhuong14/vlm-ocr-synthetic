- section: "Chân dung"
  headline: "\"Xe ôm với bộ đàm cứu được cả xóm\""
  subject_name: "Ông Bảy Phong"
  subject_role: "trưởng nhóm mạng lưới báo lũ bằng bộ đàm · 49 tuổi"
  deck: "Năm mùa lũ liên tiếp, nhóm xe ôm của ông Bảy Phong tự nguyện đo mực nước và báo tin qua bộ đàm khi hệ thống loa xã không hoạt động được."
  qa:
    - question: "Ý tưởng lập mạng lưới báo lũ bắt đầu từ đâu?"
      answer: "Từ trận lũ năm 2019, loa xã hỏng đúng lúc cần báo dân sơ tán nhất. Anh em xe ôm tụi tôi bàn nhau tự làm."
    - question: "Vì sao chọn bộ đàm thay vì điện thoại?"
      answer: "Mưa to sóng điện thoại chập chờn, mà bộ đàm chạy pin, không sợ mất sóng hay hết điện giữa chừng."
    - question: "Công việc chính của mỗi người trong nhóm là gì?"
      answer: "Mỗi người giữ một điểm đo mực nước cố định, báo về mỗi ba mươi phút khi thấy nước lên nhanh."
    - question: "Nhóm đã từng báo kịp lần nào đáng nhớ chưa?"
      answer: "Có một lần nước lên nhanh bất thường lúc nửa đêm, nhờ báo sớm mà mấy hộ vùng trũng kịp dọn đồ lên cao trước khi nước tràn vào."
    - question: "Nhóm có được hỗ trợ gì từ chính quyền không?"
      answer: "Trước thì chưa, tụi tôi tự bỏ tiền mua pin. Giờ xã đang xem xét hỗ trợ thêm bộ đàm dự phòng."
    - question: "Ông có lo mạng lưới này sẽ giải tán khi không cần nữa không?"
      answer: "Chắc không giải tán được đâu, vì lũ năm nào cũng có. Có khi còn phải mở rộng thêm người."
