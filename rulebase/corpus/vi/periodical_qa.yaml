    - year: "2024"
      text: "Đã có hơn một trăm học trò từng theo học qua các năm"

- section: "Đối thoại"
  headline: "\"Máy bơm hỏng lúc nửa đêm, tôi cũng phải đi\""
  subject_name: "Ông Sáu Phát"
  subject_role: "thợ sửa máy bơm phục vụ mười bốn xã · 54 tuổi"
  deck: "Mùa khô, điện thoại của ông Sáu Phát reo suốt ngày. Ông là thợ sửa máy bơm duy nhất trong một vùng rộng hai mươi cây số, và ông nói nghề này không có ngày nghỉ đúng nghĩa."
  qa:
    - question: "Một ngày làm việc của ông bắt đầu thế nào?"
      answer: "Năm giờ sáng điện thoại đã reo. Mùa khô là vậy, ai cũng sợ trễ giờ tưới nên gọi từ sớm."
    - question: "Ông từng sửa máy bơm lúc nào bất thường nhất?"
      answer: "Có lần nửa đêm, một hộ gọi báo máy bơm hỏng ngay lúc đang tưới ruộng gấp trước khi trời sáng. Tôi cũng phải dậy đi."
    - question: "Vì sao ông không nhận thêm người phụ việc để đỡ vất vả?"
      answer: "Tôi từng đào tạo hai người, nhưng nghề này mùa khô làm không hết việc, mùa mưa lại ngồi không. Tụi nó bỏ nghề vì thu nhập không đều."
    - question: "Ông nghĩ sao về việc mình gần như không nghỉ được ngày nào mùa khô?"
      answer: "Cực thì cực, nhưng nghĩ máy bơm hỏng là cả ruộng người ta khát nước, tôi không đành để họ chờ."
    - question: "Nghề sửa máy bơm khó nhất ở điểm nào?"
      answer: "Không phải kỹ thuật, mà là phải nhớ đường đến từng nhà trong mười bốn xã, có khi đường ruộng không tên không số."
    - question: "Ông có định nghỉ nghề khi lớn tuổi hơn không?"
      answer: "Chưa nghĩ tới nghỉ. Nhưng mong có ai học nghề này thật sự, để bà con còn có người sửa khi tôi không làm nổi nữa."
  pull_quote: "\"Máy bơm hỏng là cả ruộng người ta khát nước, tôi không đành để họ chờ.\""
  bio_rows:
    - year: "1972"
