# PERIODICAL_ARTICLE — mười bài viết độc lập, mỗi bài dùng được như bài đinh
# một trang nhất, hoặc rút gọn thành một mẩu tin ngắn ở rìa trang / cột phụ.
#
# Đây là "kho bài" chứ không phải "một số báo": mỗi lần dựng một trang, bộ
# dựng (`rulebase/periodical.py`) bốc RIÊNG một bài cho vị trí bài chính, và
# bốc thêm các bài KHÁC cho cột phụ / dải tin cuối trang / dải điểm tin đầu
# trang — nên mười bài dưới đây tự nhân lên thành rất nhiều cách sắp trang
# khác nhau, không phải mười trang cố định.
#
# Không có `byline`: tên phóng viên được bốc từ `corpus.people()` lúc dựng
# trang, để cùng một bài mà mỗi lần in ra một tên khác -- giống hệt cách một
# hoá đơn bốc tên người mua chứ không ghi cố định trong rule.
#
# Tên riêng (người, làng, xã, công ty) trong body đều là tên tự đặt, theo
# đúng lệ "Mẫu" đã dùng trong toàn bộ mười tờ tham chiếu ở
# samples/periodical-templates/ -- không tên nào trùng một địa danh/công ty
# có thật.

- kicker: "Y tế"
  headline: "Một mình một trạm, hai mươi năm không nghỉ hè"
  deck: "Trạm y tế xã Mẫu Giang chỉ có một y sĩ biên chế từ ngày thành lập. Hai mươi năm qua, bà chưa nghỉ phép quá ba ngày liên tục lần nào."
  lead_caption: "Trạm y tế xã Mẫu Giang, nơi bà Sáu trực một mình cả ngày lẫn đêm những hôm mưa lũ."
  body:
    - "Sáu giờ sáng, bà Sáu đã mở cửa trạm. Không phải vì có lịch khám, mà vì thói quen: hai mươi năm nay, trạm y tế xã Mẫu Giang chưa hôm nào đóng cửa quá tám giờ tối, kể cả khi không có bệnh nhân nào đăng ký."
    - "Xã có hơn bốn nghìn dân, phần lớn làm ruộng và đi biển theo mùa. Trạm chỉ có một y sĩ biên chế là bà, cộng thêm một điều dưỡng hợp đồng mùa vụ những tháng cao điểm."
    - "\"Có đêm ba bốn ca liền, từ trẻ sốt co giật đến người lớn bị rắn cắn ngoài đồng\", bà kể, tay vẫn đang sắp lại tủ thuốc theo thói quen mỗi tối. \"Không có ai trực thay thì mình phải quen với việc không hẹn giờ ngủ.\""
    - "Xã đã ba lần đề nghị tuyển thêm y sĩ thứ hai. Cả ba lần đều không có ứng viên nộp hồ sơ, phần vì phụ cấp thấp, phần vì đường về xã còn hai đoạn phải qua phà mùa nước lớn."
    - "Năm nay, huyện đưa xã Mẫu Giang vào danh sách được hỗ trợ luân phiên bác sĩ tuyến trên xuống công tác mỗi tháng một tuần. Bà nói đó là tin tốt nhất nhận được từ khi trạm xây lại năm 2011."
    - "\"Không mong gì hơn có người trực chung. Chỉ cần một tuần mỗi tháng, mình cũng đủ tranh thủ đi khám sức khoẻ cho chính mình\", bà cười, rồi quay lại ghi sổ trực."
  pull_quote: "\"Không có ai trực thay thì mình phải quen với việc không hẹn giờ ngủ.\""
  jump_line: "(Xem tiếp trang 6)"

- kicker: "Làng nghề"
  headline: "Khung cửi lên mạng: làng dệt Mẫu Xá bán hàng qua livestream"
  deck: "Ba năm trước, làng dệt thổ cẩm Mẫu Xá còn phụ thuộc hoàn toàn vào thương lái. Nay một nhóm phụ nữ trong làng tự livestream bán hàng, doanh thu tăng gấp ba."
  lead_caption: "Một buổi livestream bán khăn thổ cẩm ngay tại khung cửi, phát trực tiếp từ nhà chị Vân."
  body:
    - "Chị Vân đặt điện thoại lên giá ba chân tự chế bằng tre, bật đèn, rồi bắt đầu buổi phát trực tiếp thứ ba trong tuần. Sau lưng chị là khung cửi gỗ đã tróc sơn, nơi mẹ chị từng dệt cả đời."
    - "Làng Mẫu Xá có gần sáu mươi hộ còn giữ nghề dệt thổ cẩm. Trước năm 2022, gần như toàn bộ sản phẩm bán qua thương lái với giá thấp hơn một nửa so với giá bán lẻ ở thành phố."
    - "Nhóm bốn phụ nữ trong làng, trong đó có chị Vân, tự học quay video và livestream sau một lớp tập huấn ngắn do hội phụ nữ huyện tổ chức. Doanh thu của nhóm năm ngoái đạt gần chín trăm triệu đồng, gấp ba năm trước đó."
    - "\"Lúc đầu ngại lắm, quay mặt mình lên mạng thấy kỳ. Nhưng khách hỏi trực tiếp về sợi, về màu nhuộm, mình trả lời được ngay thì họ tin hơn nhiều\", chị Vân nói."
    - "Khó khăn lớn nhất hiện nay không phải bán hàng mà là sản xuất: mỗi khung cửi dệt một tấm khăn mất trung bình bốn ngày, trong khi đơn đặt hàng qua livestream về nhanh hơn tốc độ dệt."
    - "Xã đang xem xét hỗ trợ vay vốn để nhóm mua thêm khung cửi và dạy nghề cho lớp trẻ, vốn phần lớn đã rời làng đi làm công nhân."
  pull_quote: "\"Khách hỏi trực tiếp về sợi, về màu nhuộm, mình trả lời được ngay thì họ tin hơn nhiều.\""
  jump_line: "(Xem tiếp trang 9)"

- kicker: "Giao thông"
  headline: "Chuyến phà cuối cùng qua sông Mẫu Hạ"
  deck: "Cây cầu bê tông thay cho bến phà đã chở người qua sông Mẫu Hạ suốt bốn mươi ba năm dự kiến thông xe cuối năm nay. Người lái phà cuối cùng nói ông sẽ nhớ tiếng máy nổ mỗi sáng."
  lead_caption: "Ông Tư, người lái phà đời thứ hai của bến Mẫu Hạ, chuẩn bị cho chuyến cuối trong ca sáng."
  body:
    - "Bến phà Mẫu Hạ chở khách qua sông từ năm 1982, khi ông nội của ông Tư còn cầm lái chuyến đầu tiên. Nay, mỗi sáng ông Tư vẫn nổ máy đúng năm giờ, dù biết bến chỉ còn hoạt động thêm vài tháng."
    - "Cầu Mẫu Hạ, dài gần sáu trăm mét, đang trong giai đoạn hoàn thiện mặt đường. Khi thông xe, quãng đường từ hai xã hai bên bờ sẽ rút từ hai mươi phút chờ phà xuống còn ba phút chạy xe."
    - "\"Mừng chứ, dân đi lại đỡ khổ. Nhưng nghề lái phà của nhà tôi coi như hết đời thứ ba\", ông Tư nói, mắt vẫn nhìn về phía đường ray cầu đang đổ bê tông."
    - "Xã đã đề nghị chuyển ông sang làm bảo vệ tại trạm thu phí tương lai của cầu, nhưng ông chưa quyết. Ông nói còn phải tính xem có ai trong làng muốn học nghề sửa máy phà cũ để giữ lại chiếc phà làm kỷ vật."
    - "Với người dân hai xã, câu chuyện không chỉ là tốc độ. Học sinh cấp ba bên xã Mẫu Đông từng phải dậy từ bốn giờ sáng để kịp chuyến phà đầu đến trường bên kia sông."
    - "\"Con tôi sang năm vào lớp mười, chắc là lứa học sinh đầu tiên không biết cảm giác chờ phà lúc trời còn tối\", một phụ huynh chờ ở bến nói."
  pull_quote: "\"Nghề lái phà của nhà tôi coi như hết đời thứ ba.\""
  jump_line: "(Xem tiếp trang 8)"

- kicker: "Giáo dục"
  headline: "Thư viện trong container ở giữa cánh đồng"
  deck: "Không có kinh phí xây phòng đọc, một nhóm giáo viên trẻ dựng thư viện cho học sinh trong một container cũ. Ba năm sau, nơi này đã có hơn hai nghìn đầu sách."
  lead_caption: "Học sinh xã Mẫu Lâm đọc sách trong giờ ra chơi tại thư viện container."
  body:
    - "Chiếc container hai mươi feet từng dùng chở vật liệu xây dựng, nay sơn xanh lá và kê giá sách hai bên vách. Đó là toàn bộ thư viện của điểm trường xã Mẫu Lâm."
    - "Thầy Nam, giáo viên chủ nhiệm lớp bốn, là người khởi xướng ý tưởng sau khi nhận ra điểm trường không có phòng đọc riêng và ngân sách xây mới không nằm trong kế hoạch gần."
    - "\"Ban đầu chỉ xin được một trăm hai mươi cuốn sách cũ từ một dự án thiện nguyện. Giờ đã hơn hai nghìn cuốn, đa số do phụ huynh và cựu học sinh góp\", thầy Nam nói."
    - "Mùa hè, container trở nên nóng bức nên trường xin được một chiếc quạt công nghiệp lắp ở đầu container, chạy bằng tấm pin mặt trời nhỏ do một nhóm sinh viên tình nguyện lắp đặt."
    - "Học sinh được mượn sách mang về nhà không giới hạn thời gian, miễn ghi tên vào sổ mượn đặt ngay cửa ra vào — một sổ tay đã kín gần bốn trăm trang chỉ trong ba năm."
    - "Trường đang gây quỹ thêm một container thứ hai làm phòng đọc cho học sinh lớn hơn, dự kiến hoàn thành trước năm học tới nếu đủ vốn."
  pull_quote: "\"Ban đầu chỉ xin được một trăm hai mươi cuốn sách cũ. Giờ đã hơn hai nghìn cuốn.\""
  jump_line: "(Xem tiếp trang 11)"

- kicker: "Nông nghiệp"
  headline: "Mười hai người phụ nữ và một hợp đồng bao tiêu đầu tiên"
  deck: "Sau ba vụ tự tìm đầu ra thất bại, nhóm nông dân trồng rau xã Mẫu Điền ký được hợp đồng bao tiêu đầu tiên với một chuỗi siêu thị. Giá bán ổn định hơn nhưng đòi hỏi khắt khe hơn nhiều."
  lead_caption: "Chị Hạnh (giữa) cùng các thành viên tổ hợp tác đóng gói rau sáng sớm để kịp xe tải đến lấy hàng."
  body:
    - "Bốn giờ sáng, mười hai người phụ nữ đã có mặt ở khu sơ chế rau tạm bợ dựng bằng khung tre và bạt. Đây là ngày giao hàng thứ sáu theo hợp đồng mới ký với một chuỗi siêu thị khu vực."
    - "Trước đó, tổ hợp tác xã Mẫu Điền từng ba lần mang rau ra chợ đầu mối bán trực tiếp, và cả ba lần đều gặp cảnh giá rớt giữa vụ vì trùng thời điểm thu hoạch với các vùng khác."
    - "\"Ký hợp đồng thì giá ổn định hơn thật, nhưng tiêu chuẩn cũng khác hẳn. Rau phải đúng kích cỡ, không được có lá sâu dù chỉ một chấm nhỏ\", chị Hạnh, tổ trưởng, nói."
    - "Tỷ lệ rau bị trả lại vì không đạt chuẩn giảm từ gần ba mươi phần trăm trong tháng đầu xuống còn khoảng tám phần trăm sau khi tổ được tập huấn lại kỹ thuật phân loại."
    - "Khoản đầu tư lớn nhất hiện tại là một buồng bảo quản lạnh mini, thứ tổ chưa đủ vốn mua nhưng đang được huyện xem xét hỗ trợ một phần vì đây là mô hình thí điểm của xã."
    - "\"Nếu có buồng lạnh, mình giữ rau tươi thêm được một ngày, không phải bán tháo giá thấp vào cuối phiên nữa\", chị Hạnh nói, tay vẫn thoăn thoắt xếp rau vào sọt nhựa."
  pull_quote: "\"Rau phải đúng kích cỡ, không được có lá sâu dù chỉ một chấm nhỏ.\""
  jump_line: "(Xem tiếp trang 7)"

- kicker: "Nghề truyền thống"
  headline: "Nước mắm nhà thùng giữ khách bằng cách không giảm giá"
  deck: "Trong lúc nhiều cơ sở nước mắm truyền thống giảm giá để cạnh tranh với nước chấm công nghiệp, nhà thùng của ông Hai chọn giữ nguyên giá và công khai toàn bộ quy trình ủ chượp."
  lead_caption: "Ông Hai kiểm tra độ đạm của một thùng chượp đã ủ được mười bốn tháng."
  body:
    - "Nhà thùng của ông Hai có chín thùng gỗ, thùng cũ nhất đã qua tay ba đời trong gia đình. Mỗi thùng ủ chượp cá cơm với muối trong tối thiểu mười hai tháng trước khi rút nước mắm cốt đầu tiên."
    - "Năm năm qua, số cơ sở nước mắm truyền thống trong vùng giảm gần một nửa, phần lớn không cạnh tranh nổi về giá với nước chấm pha chế công nghiệp bán trong siêu thị."
    - "\"Người ta giảm giá được vì rút ngắn thời gian ủ, pha thêm phụ gia. Mình không làm được vậy, mà cũng không muốn làm vậy\", ông Hai nói."
    - "Thay vì giảm giá, ông chọn cách công khai: khách đến tận nhà thùng được xem toàn bộ quy trình, đo độ đạm ngay tại chỗ bằng dụng cụ đơn giản, và ghi ngày ủ lên từng thùng."
    - "Cách làm này giúp nhà thùng giữ được một nhóm khách quen ổn định, chủ yếu đặt hàng qua giới thiệu truyền miệng, dù sản lượng chỉ bằng một phần năm so với mười năm trước."
    - "\"Bán ít hơn nhưng bán đúng giá trị. Tôi không tính chuyện mở rộng, chỉ tính chuyện giữ cho được chín thùng này đến khi có người trong nhà chịu học nghề\", ông nói."
  pull_quote: "\"Bán ít hơn nhưng bán đúng giá trị.\""
  jump_line: "(Xem tiếp trang 10)"

- kicker: "Giáo dục"
  headline: "Bốn mươi cây số mỗi ngày cho một giờ học nhạc"
  deck: "Trường tiểu học xã Mẫu Sơn không có giáo viên âm nhạc biên chế suốt sáu năm. Một cô giáo ở huyện bên tình nguyện dạy một buổi mỗi tuần, đi về tổng cộng bốn mươi cây số."
  lead_caption: "Cô Hiền dạy học sinh lớp ba xã Mẫu Sơn tập hát trong giờ âm nhạc duy nhất của tuần."
  body:
    - "Mỗi thứ Năm, cô Hiền dậy từ năm giờ ba mươi để kịp vượt đèo sang xã Mẫu Sơn dạy một buổi âm nhạc duy nhất trong tuần cho học sinh tiểu học ở đây."
    - "Trường có hai trăm học sinh nhưng không có giáo viên âm nhạc biên chế từ sáu năm nay, sau khi giáo viên cũ chuyển công tác và không có người thay thế do định mức biên chế của huyện."
    - "\"Ban đầu tôi chỉ định dạy thử một học kỳ giúp trường. Không ngờ dạy luôn sáu năm\", cô Hiền nói, tay vẫn đang lên dây guitar cũ mượn của trường."
    - "Học sinh chỉ được học nhạc một buổi mỗi tuần, ngắn hơn nhiều so với chương trình khung, nhưng cô Hiền cố gắng dạy đủ để các em biết hát đúng nhịp trước khi lên cấp hai."
    - "Phòng giáo dục huyện đã ba lần đăng tuyển giáo viên âm nhạc cho trường nhưng không có hồ sơ nộp, phần vì phụ cấp thấp, phần vì đường đến trường khó đi vào mùa mưa."
    - "\"Tôi không nghĩ mình sẽ dừng lại giữa chừng. Chỉ mong huyện tuyển được người thật sự, để các em có giáo viên dạy đủ số buổi theo đúng chương trình\", cô Hiền nói."
  pull_quote: "\"Ban đầu tôi chỉ định dạy thử một học kỳ. Không ngờ dạy luôn sáu năm.\""
  jump_line: "(Xem tiếp trang 12)"

- kicker: "Phòng chống thiên tai"
  headline: "Mạng lưới báo lũ bằng bộ đàm của những người lái xe ôm"
  deck: "Không có hệ thống cảnh báo tự động, một nhóm xe ôm ở xã Mẫu Khê tự lập mạng lưới báo mực nước bằng bộ đàm, hoạt động đã năm mùa lũ liên tiếp."
  lead_caption: "Ông Bảy kiểm tra mực nước tại điểm đo tự quy ước trước khi báo qua bộ đàm cho nhóm."
  body:
    - "Mỗi khi trời mưa liên tục quá hai ngày, ông Bảy và bảy người lái xe ôm khác trong xã Mẫu Khê lại chia nhau ra các điểm đo mực nước tự quy ước dọc con sông chảy qua xã."
    - "Mạng lưới hình thành sau trận lũ năm 2019, khi xã không kịp báo dân sơ tán vì hệ thống loa truyền thanh bị hỏng đúng lúc cần nhất."
    - "\"Xã có loa nhưng lúc mưa to hay mất điện là loa im luôn. Anh em xe ôm thì ai cũng có bộ đàm chạy pin, không lo mất điện\", ông Bảy giải thích."
    - "Mỗi người phụ trách một điểm đo cố định, báo mực nước qua bộ đàm mỗi ba mươi phút khi nước lên nhanh. Thông tin sau đó được truyền miệng qua từng xóm bằng xe máy."
    - "Năm mùa lũ qua, mạng lưới đã báo sớm được ba đợt nước lên bất thường, giúp các hộ ở vùng trũng kịp di dời tài sản trước khi nước tràn vào nhà."
    - "Xã đang đề xuất hỗ trợ kinh phí pin và bộ đàm dự phòng cho nhóm, đồng thời ghi nhận mô hình này vào phương án phòng chống thiên tai chính thức của địa phương."
  pull_quote: "\"Anh em xe ôm thì ai cũng có bộ đàm chạy pin, không lo mất điện.\""
  jump_line: "(Xem tiếp trang 5)"

- kicker: "Văn hoá"
  headline: "Người thợ sơn mài cuối cùng nhận học trò trái nghề"
  deck: "Không còn ai trong làng theo nghề sơn mài, ông Tám quyết định nhận hai học trò không phải người địa phương, với điều kiện họ phải ở lại làng ít nhất ba năm."
  lead_caption: "Ông Tám hướng dẫn học trò mài lớp sơn mài thứ bảy trên một tấm bình phong."
  body:
    - "Xưởng sơn mài của ông Tám là xưởng cuối cùng còn hoạt động trong làng, nơi từng có hơn hai mươi hộ làm nghề vào những năm 1990."
    - "Một sản phẩm sơn mài hoàn chỉnh qua tay ông mất tối thiểu tám tháng, với hơn mười lớp sơn, mỗi lớp phải khô hoàn toàn trước khi mài lớp tiếp theo."
    - "\"Lớp trẻ trong làng không ai theo nữa, làm nghề khác thu nhập nhanh hơn nhiều. Tôi tính nghề này chắc hết đời mình\", ông Tám nói, trước khi nhận hai học trò từ tỉnh khác tìm đến."
    - "Điều kiện ông đưa ra không phải về học phí, mà là cam kết ở lại làng học đủ ba năm — thời gian ông cho là tối thiểu để nắm được kỹ thuật pha sơn và mài đúng độ bóng truyền thống."
    - "Hai học trò hiện sống trong một căn phòng nhỏ cạnh xưởng, ban ngày phụ việc pha sơn và mài, tối tự học thêm qua sách ông Tám giữ lại từ thời còn học nghề."
    - "\"Tôi không dám chắc họ sẽ theo nghề cả đời. Nhưng ít nhất ba năm nữa, nghề này còn có người biết làm đúng cách\", ông nói."
  pull_quote: "\"Tôi tính nghề này chắc hết đời mình.\""
  jump_line: "(Xem tiếp trang 13)"

- kicker: "Đời sống"
  headline: "Người sửa máy bơm đi khắp mười bốn xã bằng một chiếc xe máy cà tàng"
  deck: "Mùa khô, chiếc xe máy chở đồ nghề của ông Sáu là thứ duy nhất đứng giữa một cánh đồng khát nước và một cánh đồng được tưới. Ông là thợ sửa máy bơm duy nhất trong bán kính hai mươi cây số."
  lead_caption: "Ông Sáu sửa máy bơm ngay tại ruộng cho một hộ nông dân xã Mẫu Tân."
  body:
    - "Điện thoại của ông Sáu reo liên tục từ năm giờ sáng mỗi khi vào mùa tưới. Ông là thợ sửa máy bơm nước duy nhất phục vụ mười bốn xã trong bán kính hai mươi cây số."
    - "Nghề này ông học từ cha, ban đầu chỉ định làm thêm ngoài việc đồng áng. Hai mươi năm sau, ông gần như không còn thời gian làm ruộng của chính mình."
    - "\"Máy bơm hỏng đúng lúc cần tưới thì coi như mất cả vụ. Nông dân gọi mình còn khẩn hơn gọi bác sĩ\", ông Sáu cười, vừa nói vừa tháo bugi kiểm tra."
    - "Trung bình mỗi ngày mùa khô, ông chạy xe máy hơn tám mươi cây số giữa các điểm sửa, mang theo bộ đồ nghề nặng gần hai mươi ký buộc sau xe."
    - "Ông từng thử đào tạo hai người phụ việc nhưng cả hai đều bỏ nghề sau một mùa vì thu nhập không ổn định giữa các tháng trong năm."
    - "\"Mùa khô thì gọi không kịp trả lời, mùa mưa thì cả tháng không ai gọi. Nghề này khó có người trẻ theo lâu dài là vì vậy\", ông nói, rồi lại nổ máy phóng đi điểm sửa tiếp theo."
  pull_quote: "\"Nông dân gọi mình còn khẩn hơn gọi bác sĩ.\""
  jump_line: "(Xem tiếp trang 14)"
