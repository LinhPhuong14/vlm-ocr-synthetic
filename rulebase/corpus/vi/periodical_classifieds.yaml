# PERIODICAL_CLASSIFIEDS — sáu bộ trang rao vặt trọn vẹn. Mỗi bộ là MỘT khối
# thống nhất (khác `periodical_article.yaml`): các mẩu rao trong một bộ được
# viết để cùng xuất hiện trên một trang, không tách lẻ ra bốc riêng như bài
# viết, vì một trang rao vặt là các mẩu tin của những người khác nhau đăng
# cùng một kỳ báo, không phải các "bài" độc lập có thể xáo trộn qua các trang
# khác nhau.
#
# `heading` khác rỗng đánh dấu một mẩu rao "có khung" (trả thêm phí); `lead_in`
# là chữ in đậm mở đầu một mẩu rao thường ("Cho thuê", "Tuyển", ...).
#
# Mỗi bộ mang khoảng 16-18 mẩu rao trải trên 3-4 chuyên mục, đủ dày để cột
# báo 6 cột (`column-fill: auto`) tràn qua nhiều hơn một cột khi dựng trang --
# xem `generators/html/sheets/periodical.py` và phép đo trong
# `samples/periodical-templates/README.md` cho lý do vì sao mật độ này quan
# trọng hơn là chỉ "không tràn khung".

