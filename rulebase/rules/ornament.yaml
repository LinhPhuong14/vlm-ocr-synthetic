# THUỘC TÍNH 6/10 — CON DẤU VÀ HOẠ TIẾT
#
# Mực KHÔNG PHẢI chữ trên tờ giấy: con dấu đóng đè lên chữ ký, dải sóng nẹp
# dưới băng đầu trang, hoa văn guilloche in chìm sau bảng, nẹp góc, lưới chữ
# nhật mờ ở chân trang.
#
# Mỗi `file` ở đây phải có một PNG cùng tên trong `textures/ornament/`, sinh
# bằng `tools/make_ornaments.py` (`make ornaments`). Thiếu file thì
# `pipeline/preflight.py` báo trước khi sinh ảnh, chứ không để tới lúc render
# mới vỡ.
#
# Bốc SAU `color` và TRƯỚC `augmentation`: tờ giấy chọn màu mực xong mới biết
# nó mang dấu má gì, và mọi thứ đó phải có mặt trên trang trước khi trang bị
# làm cũ. Đóng dấu lên một tờ đã ố vàng thì con dấu trông như dán vào.
#
# --------------------------------------------------------------------------
# `marks` là danh sách [tên_file, {tham số}], đọc theo thứ tự vẽ — cùng lối
# viết với `chain` trong rules/augmentation.yaml.
#
#   anchor    chỗ đặt trên trang. header_band | letterhead | table_back |
#             totals | signature_seller | signature_buyer | footer_band |
#             corner_tl | corner_tr | corner_bl | corner_br | page_center |
#             page_edge_left | page_full
#   scale     bề rộng, tính theo PHẦN của bề rộng trang (0.30 = 30%)
#   opacity   [thấp, cao] — bốc trong khoảng
#   rotate    [thấp, cao] độ — con dấu đóng tay không bao giờ thẳng
#
# `id` và `tags` viết tiếng Anh vì là định danh trong code; chữ IN LÊN con dấu
# nằm trong `tools/make_ornaments.py` và giữ tiếng Việt.

groups:

  # ------------------------------------------------------------------------
  - id: bare
    label: "Không hoạ tiết — tờ giấy chỉ có chữ"
    # Giá trị mặc định, và là giá trị DUY NHẤT không có ràng buộc nào: mọi tổ
    # hợp thẻ khác đều phải bốc được ít nhất một giá trị của thuộc tính này,
    # nếu không sampler sẽ bí ở đây.
    options:
      - id: no_ornament
        weight: 8
        tags: [plain_sheet]

  # ------------------------------------------------------------------------
  - id: seal
    label: "Con dấu — mực ép lên tờ giấy đã in xong"
    # Giấy tính tiền in tại quầy không bao giờ có dấu: nó không phải chứng từ,
    # không ai ký, không ai đóng dấu.
    requires: [doc_invoice]
    tags: [has_seal]
    options:
      - id: seller_seal
        weight: 4
        params:
          marks:
            - [seal_round_company, {anchor: signature_seller, scale: 0.26,
                                    opacity: [0.72, 0.90], rotate: [-16, 16]}]

      - id: hotel_seal
        weight: 3
        requires: [doc_lodging]
        params:
          marks:
            - [seal_round_hotel, {anchor: signature_seller, scale: 0.24,
                                  opacity: [0.70, 0.88], rotate: [-14, 14]}]

      - id: export_seal
        weight: 2
        requires: [doc_export]
        params:
          marks:
            - [seal_round_export, {anchor: signature_seller, scale: 0.26,
                                   opacity: [0.70, 0.88], rotate: [-12, 12]}]

      # Dấu tròn và dấu chức danh đóng cạnh nhau: trên chứng từ Việt Nam hai
      # thứ này gần như luôn đi cùng, và thuộc tính chỉ bốc MỘT giá trị mỗi tờ
      # nên chúng phải nằm chung một giá trị.
      - id: seal_with_name_block
        weight: 3
        params:
          marks:
            - [seal_round_company, {anchor: signature_seller, scale: 0.26,
                                    opacity: [0.72, 0.90], rotate: [-16, 16]}]
            - [seal_name_block, {anchor: signature_seller, scale: 0.24,
                                 opacity: [0.72, 0.92], rotate: [-6, 6]}]

      - id: seal_and_paid
        weight: 2
        params:
          marks:
            - [seal_round_company, {anchor: signature_seller, scale: 0.26,
                                    opacity: [0.72, 0.90], rotate: [-16, 16]}]
            - [seal_square_paid, {anchor: totals, scale: 0.30,
                                  opacity: [0.65, 0.85], rotate: [-9, 9]}]

      - id: copy_stamp
        weight: 1
        params:
          marks:
            - [seal_square_copy, {anchor: page_center, scale: 0.42,
                                  opacity: [0.35, 0.55], rotate: [-8, 8]}]

      # Cùng con dấu ấy, đóng hỏng theo hai kiểu. Không phải mẫu khác — là
      # cùng mặt dấu, tay đóng khác.
      - id: seal_struck_twice
        weight: 2
        params:
          marks:
            - [seal_round_company_double, {anchor: signature_seller, scale: 0.30,
                                           opacity: [0.68, 0.86], rotate: [-14, 14]}]

      - id: seal_short_of_ink
        weight: 2
        params:
          marks:
            - [seal_round_company_faint, {anchor: signature_seller, scale: 0.26,
                                          opacity: [0.60, 0.80], rotate: [-16, 16]}]

      # Dấu giáp lai: đóng vắt qua mép hai tờ nên tờ này chỉ giữ được một nửa.
      # `anchor: page_edge_left` là mép giấy, không phải một khối nội dung —
      # chỗ duy nhất trong bộ này neo vào giấy chứ không neo vào chữ.
      - id: overlap_seal
        weight: 2
        requires: [printed_form]
        params:
          marks:
            - [seal_edge_half, {anchor: page_edge_left, scale: 0.10,
                                opacity: [0.62, 0.84], rotate: [-3, 3]}]
            - [seal_accounting_posted, {anchor: footer_band, scale: 0.26,
                                        opacity: [0.55, 0.78], rotate: [-7, 7]}]

  # ------------------------------------------------------------------------
  - id: flourish
    label: "Hoạ tiết thiết kế — in cùng lúc với chữ, không phải đóng thêm"
    excludes: [till_receipt]
    tags: [has_flourish]
    options:
      - id: security_print
        weight: 3
        requires: [printed_form]
        tags: [guilloche_back]
        params:
          marks:
            - [guilloche_violet, {anchor: table_back, scale: 0.34, opacity: [0.16, 0.30]}]

      - id: watermark_copy
        weight: 2
        params:
          marks:
            - [watermark_ban_sao, {anchor: page_full, scale: 1.0, opacity: [0.55, 0.85]}]

      - id: watermark_sample
        weight: 2
        requires: [printed_form]
        params:
          marks:
            - [watermark_hoa_don_mau, {anchor: page_full, scale: 1.0,
                                       opacity: [0.60, 0.90]}]

      - id: branded_teal
        weight: 3
        requires: [doc_service]
        params:
          marks:
            - [wave_band_teal, {anchor: header_band, scale: 1.0, opacity: [0.75, 0.95]}]
            - [guilloche_teal, {anchor: table_back, scale: 0.30, opacity: [0.14, 0.26]}]
            - [corner_bracket_teal, {anchor: corner_bl, scale: 0.14, opacity: [0.25, 0.45]}]
            - [rect_grid_teal, {anchor: footer_band, scale: 1.0, opacity: [0.10, 0.22]}]

      - id: branded_green
        weight: 3
        requires: [doc_service]
        params:
          marks:
            - [wave_band_green, {anchor: header_band, scale: 1.0, opacity: [0.75, 0.95]}]
            - [guilloche_green, {anchor: table_back, scale: 0.30, opacity: [0.14, 0.26]}]
            - [corner_bracket_green, {anchor: corner_br, scale: 0.14, opacity: [0.25, 0.45]}]
            - [rect_grid_green, {anchor: footer_band, scale: 1.0, opacity: [0.10, 0.22]}]

      - id: wave_only
        weight: 2
        requires: [doc_service]
        params:
          marks:
            - [wave_band_red, {anchor: header_band, scale: 1.0, opacity: [0.70, 0.90]}]

      # Hoa văn trống đồng: nhà hàng, khách sạn, tiệm bánh Việt Nam rất hay lấy
      # hoa văn truyền thống làm nhận diện, và không hoạ tiết phương Tây nào
      # thay được chỗ này.
      - id: dong_son_brand
        weight: 3
        requires: [doc_service]
        tags: [vietnamese_motif]
        params:
          marks:
            - [motif_dong_son, {anchor: table_back, scale: 0.32, opacity: [0.10, 0.20]}]
            - [corner_bracket_green, {anchor: corner_tr, scale: 0.12, opacity: [0.20, 0.40]}]

      - id: dong_son_teal
        weight: 2
        requires: [doc_lodging]
        tags: [vietnamese_motif]
        params:
          marks:
            - [motif_dong_son_teal, {anchor: header_band, scale: 0.18,
                                     opacity: [0.30, 0.55]}]

  # ------------------------------------------------------------------------
  - id: machine
    label: "Mã máy đọc — vạch và ô vuông, nội dung lấy từ chính tờ giấy"
    # KHÔNG ràng buộc cả họ: mã vạch nằm trên giấy tính tiền siêu thị, mã QR
    # nằm trên hoá đơn điện tử, hai thứ loại trừ nhau nên ràng buộc đặt ở từng
    # giá trị.
    tags: [has_machine_code]
    options:
      # Bố cục siêu thị vẫn IN dãy số mã vạch mà chưa bao giờ in vạch, nên nhãn
      # dữ liệu đang ghi một mã vạch mà ảnh không có hình. `from_receipt` là
      # chỗ sửa: vạch phải dựng từ đúng dãy số đã bốc.
      - id: shelf_barcode
        weight: 4
        requires: [has_barcode]
        params:
          marks:
            - [barcode_ean13_sample, {anchor: footer_band, scale: 0.46,
                                      opacity: [0.90, 1.0], from_receipt: true}]

      - id: verify_qr
        weight: 4
        requires: [doc_invoice]
        params:
          marks:
            - [qr_verify_sample, {anchor: letterhead, scale: 0.14,
                                  opacity: [0.92, 1.0], from_receipt: true}]

      - id: qr_and_seal
        weight: 2
        requires: [doc_invoice]
        params:
          marks:
            - [qr_verify_sample, {anchor: letterhead, scale: 0.14,
                                  opacity: [0.92, 1.0], from_receipt: true}]
            - [seal_name_block_chief, {anchor: signature_seller, scale: 0.24,
                                       opacity: [0.72, 0.92], rotate: [-6, 6]}]
