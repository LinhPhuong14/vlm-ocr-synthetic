# THUỘC TÍNH 8/11 — LÀM CŨ
#
# Hai hiệu ứng texture của DocCreator còn dùng ở đây:
#   paper_texture      dán trang giấy lên texture giấy thật
#   phantom_character  dán mảng mực thừa vào rìa chữ
#
# ---- BẢY GIÁ TRỊ ĐANG TẮT, VÀ MỘT MÔ HÌNH ĐÃ RÚT KHỎI MỌI CHUỖI ----
#
# `enabled: false` = có mặt, không bao giờ bốc trúng, vẫn dựng lại được khi gọi
# đích danh (`--force augmentation=stains`). Cùng một chữ mà
# `rulebase/layouts/*.yaml` và `rules/handwriting.yaml` đang dùng.
#
#   stains, crumpled          dùng `gradient_domain` — vết bẩn ghép bằng
#                             Poisson blending, che mất chữ ở chỗ nó dán vào
#   torn_edges, punched       dùng `holes` — phần giấy mất đi lấp bằng màu đen,
#                             xoá hẳn chữ nằm dưới
#   photocopy,                ba kịch bản bản-photo: tương phản cao, mực bệt,
#   photocopy_screened,       lưới tram, nhoè ống kính
#   photocopy_stamped
#
# Bốn cái đầu từng bị XOÁ hẳn, vì lúc ấy `weight: 0` là thứ `validate()` gọi là
# luật chết và chưa có cách khai "tắt có chủ đích". Cái giá đo được: 58 ảnh đã
# commit ghi một trong bốn id ấy và `tools/check_boxes.py` im lặng bỏ qua từng
# ảnh một. Nay chúng quay lại ở trạng thái tắt, nên số ấy về 0.
#
# `heavy` là ngoại lệ đi hướng khác: `holes` chỉ là 1 trong 6 bước của nó, và
# `bleed_through` không có giá trị nào khác dùng, nên nó Ở LẠI và mất đúng bước
# `holes`. Với `stains` thì ngược hẳn — bỏ `gradient_domain` đi thì phần còn lại
# là một bản `light` viết lại, và một id nói dối về pixel của chính nó là đúng
# loại lỗi kho này tồn tại để chặn.
#
# Mọi mô hình vẫn còn trong `degradation/` và vẫn có test: `degradation/` là
# thư viện, file này mới là chỗ quyết định dùng gì. Mô hình nào không còn giá
# trị ĐANG BẬT nào gọi tới thì phải khai trong `degradation.SWITCHED_OFF`, và
# `make check-rules` soát hai chiều.
#
# ---- `paper_overlay`: RÚT RỒI BẬT LẠI, và cái đã đo được ----
#
# Nó phủ ảnh chụp giấy thật của SynthDoG (`augmentations/data/image/`) lên TRÊN
# CÙNG mọi thứ, kể cả mực — khác `paper_texture` ở CHỖ ĐỨNG trong chuỗi chứ
# không ở ảnh dùng. Qua cả hai thì trang giấy trông như được IN LÊN giấy, chứ
# không phải dán lên ảnh giấy.
#
# Ngày 27/08 nó bị rút khỏi cả bảy chuỗi, vì một lý do ĐO ĐƯỢC: sáu tấm ảnh
# nguồn là giấy nhàu, mờ, nền xám loang lổ diện tích lớn, và ở alpha 0,22–0,34
# trên một trang A4 thì cả nửa dưới trang chìm trong mảng xám mất chi tiết —
# phát hiện trên một trang `insurance_health_id_card`. Nay **bật lại theo yêu
# cầu**, đúng bảy chuỗi và đúng alpha cũ.
#
# Nếu mảng xám ấy quay lại thì đây là hai cái núm, theo thứ tự nên vặn:
#
#   1. **Đổi ảnh nguồn.** Đó mới là gốc của vấn đề: sáu tấm ảnh kia chụp giấy
#      đã nhàu sẵn, không phải giấy phẳng. Một tấm giấy A4 trắng chụp đều sáng
#      sẽ cho đúng hiệu ứng "in lên giấy" mà không mang theo nếp nhàu của tờ
#      giấy khác.
#   2. **Hạ `alpha`** trong từng chuỗi dưới đây. Nó nhân, nên 0,15 vẫn thấy
#      được vân giấy mà không lấp mất chữ.
#
# `paper_texture` không liên quan: nó chạy ĐẦU chuỗi và NHÂN chứ không hoà,
# nên tờ giấy hiện dưới chữ mà không làm bệt nét mực (`alpha` chỉ làm tối;
# `grain` và `creases` thì hai chiều — nếp gấp bắt sáng thì sáng hơn mặt giấy
# quanh nó). Đây vẫn là lớp "giấy" mặc định của mọi thuộc tính có texture.
#
# Bốc sau cùng, nên chỗ này thấy được mọi thẻ phía trên. Ví dụ trang in nhiệt
# không bao giờ bị "bleed-through" vì giấy nhiệt chỉ in một mặt.

options:
  - id: pristine
    weight: 2
    tags: [clean]
    params:
      chain: []

  - id: real_paper
    weight: 4
    tags: [textured]
    params:
      chain:
        - [paper_texture, {alpha: 0.35, grain: 0.5}]
        - [paper_overlay, {alpha: 0.28, lighten: 0.3}]

  - id: light
    weight: 4
    tags: [textured]
    params:
      chain:
        - [paper_texture, {alpha: 0.30, grain: 0.4}]
        - [blur_zones, {radius: 0.9, zones: 1, coverage: 0.12}]

  - id: medium
    weight: 4
    tags: [textured]
    params:
      chain:
        - [paper_texture, {alpha: 0.40, grain: 0.6}]
        - [blur_zones, {radius: 1.1, zones: 2, coverage: 0.15}]
        - [shadow_binding, {border: bottom, distance_ratio: 0.10, intensity: 0.35}]
        - [paper_overlay, {alpha: 0.3, lighten: 0.35}]

  - id: heavy
    weight: 2
    excludes: [thermal]         # giấy nhiệt in một mặt, không thấm sang mặt kia
    tags: [textured, dirty]
    params:
      chain:
        - [paper_texture, {alpha: 0.45, grain: 0.7}]
        - [bleed_through, {intensity: 0.5, nb_iter: 6}]
        - [blur_zones, {radius: 1.4, zones: 3, coverage: 0.18}]
        - [shadow_binding, {border: left, distance_ratio: 0.13, intensity: 0.45}]

  # ---- BỐN GIÁ TRỊ NÀY ĐÃ TỪNG BỊ XOÁ, NAY QUAY LẠI Ở TRẠNG THÁI TẮT ----
  #
  # Chúng dùng `gradient_domain` và `holes`, hai mô hình đã tắt. Lần đầu tôi
  # XOÁ hẳn, vì lúc ấy `weight: 0` là thứ `validate()` gọi là luật chết và
  # không có cách nào khai "tắt có chủ đích". Cái giá: 58 ảnh đã commit trong
  # `data/` ghi một trong bốn id này, và `tools/check_boxes.py` không dựng lại
  # được trang nào trong số đó nữa — nó bắt đúng trường hợp "luật không còn tồn
  # tại" rồi bỏ qua ảnh ấy, tức là im lặng kiểm ít đi.
  #
  # `enabled: false` (thêm cùng lúc với `rulebase/layouts/*.yaml`) nói được
  # đúng điều cần nói: có mặt, không bao giờ bốc trúng, vẫn dựng lại được khi
  # gọi đích danh. Nên chúng quay về.
  - id: stains
    enabled: false
    weight: 3
    tags: [textured, dirty]
    params:
      chain:
        - [paper_texture, {alpha: 0.35, grain: 0.5}]
        - [gradient_domain, {count: 5, strength: 0.75}]

  - id: crumpled
    enabled: false
    weight: 2
    requires: [thermal]
    tags: [textured, creased]
    params:
      chain:
        - [paper_texture, {alpha: 0.50, grain: 0.8, creases: 4}]
        - [gradient_domain, {count: 3, strength: 0.6}]
        - [blur_zones, {radius: 1.2, zones: 3, coverage: 0.18}]
        - [paper_overlay, {alpha: 0.34, lighten: 0.3}]

  - id: torn_edges
    enabled: false
    weight: 2
    tags: [textured, torn]
    params:
      chain:
        - [paper_texture, {alpha: 0.40, grain: 0.6, creases: 2}]
        - [holes, {count: 2, placement: border, size_ratio: 0.16, fill: black}]
        - [holes, {count: 1, placement: corner, size_ratio: 0.26, fill: black}]
        - [blur_zones, {radius: 1.0, zones: 2, coverage: 0.14}]

  - id: punched
    enabled: false
    weight: 1
    tags: [textured, torn]
    params:
      chain:
        - [paper_texture, {alpha: 0.45, grain: 0.7}]
        - [holes, {count: 3, placement: center, size_ratio: 0.09, fill: black}]
        - [shadow_binding, {border: left, distance_ratio: 0.10, intensity: 0.35}]

  - id: ghost_text
    weight: 3
    tags: [textured, ghosting]
    params:
      chain:
        - [paper_texture, {alpha: 0.30, grain: 0.45}]
        - [phantom_character, {frequency: rare}]
        - [blur_zones, {radius: 1.2, zones: 2, coverage: 0.15}]

  # Bản photo dựng KHÔNG có lưới tram: tương phản cao, mực bệt, nhoè ống kính.
  # `photocopy_screened` ở cuối file là bản có tram thật.
  #
  # Ba giá trị `photocopy*` từng TẮT mà không có dòng nào ghi vì sao, và
  # `halftone_screen` tắt theo chúng — lý do nó ghi trong `degradation/
  # __init__.py` đọc nguyên văn là "không tự nó bị loại: hai giá trị duy nhất
  # gọi tới nó đã tắt cùng `photocopy`". Một vòng luẩn quẩn: photocopy tắt nên
  # halftone tắt, halftone tắt nên photocopy không bật lại được.
  #
  # Cắt vòng bằng cách đo. Ba trang mỗi giá trị (seed 11, 23, 41), mọi trục
  # khác ghim cứng, chấm bằng `agent/critic.py`: **0 lỗi nặng, 0 lỗi nhẹ** cho
  # cả ba — bằng đúng `pristine`. Chữ vẫn đọc được qua lưới tram; không mã nào
  # trong mười ba mã kêu.
  #
  # `photocopy_stamped` cũng là consumer sống duy nhất của `pattern_overlay`,
  # một mô hình đang BẬT mà trước đó không luật nào gọi tới.
  - id: photocopy
    enabled: true
    weight: 3
    tags: [textured, high_contrast]
    params:
      chain:
        - [paper_texture, {alpha: 0.25, grain: 0.35}]
        - [phantom_character, {frequency: rare}]
        # Hộp mực sắp hết: mảng đậm, mảng cháy trắng, dải xám bị đẩy về
        # hai đầu. Đây là thứ ăn mất DẤU THANH trước tiên — dấu là nét
        # mảnh nên xám hơn thân chữ.
        - [bad_photocopy, {blotch: 0.30, wash: 0.20, contrast: 0.30, cell: 52}]
        - [blur, {radius: 0.8}]
        - [shadow_binding, {border: top, distance_ratio: 0.08, intensity: 0.3}]
        - [paper_overlay, {alpha: 0.22, lighten: 0.4}]
        # Máy photo chỉ có MỘT hộp mực. Cuối chuỗi, vì mọi bước dán ảnh
        # giấy ở trên đều mang màu vào lại.
        - [monochrome, {}]

  # --------------------------------------------------------------------
  # HOẠ TIẾT CỦA KHÂU CHỤP LẠI
  #
  # Bốn giá trị dưới đây khác mọi giá trị trên ở chỗ chúng KHÔNG làm hỏng tờ
  # giấy: tờ giấy vẫn nguyên, chỉ bản sao của nó mang thêm một hoạ tiết tuần
  # hoàn do thiết bị áp lên — lưới tram của máy photocopy, dải sáng tối theo
  # trục lăn của máy quét, lưới 8×8 của JPEG.
  #
  # Vì sao ở đây chứ không ở `ornament`: `ornament` là mực CỐ Ý có mặt trên
  # giấy, ai đó in nó hoặc đóng nó. Bốn thứ này không ai muốn có — chúng là dấu
  # vết của đường đi từ tờ giấy tới tệp ảnh. Thứ tự bốc nói đúng điều đó:
  # `ornament` trước, `augmentation` sau.
  #
  # `pattern_overlay` là ngoại lệ có chủ ý và là cầu nối sang
  # `textures/ornament/`: con dấu đóng lên BẢN SAO chứ không lên bản gốc, chữ
  # chìm máy photocopy in đè lên tất cả. Nó trộn theo lối nhân nên chữ nằm dưới
  # dấu vẫn đọc được — nhãn dữ liệu vẫn khai là có chữ ở đó.

  # Khác `photocopy` ở trên: cái đó dựng dáng bản photo bằng những gì có sẵn
  # trước khi có mô hình tram — tương phản cao, mực bệt, nhoè. Cái này có lưới
  # tram thật. Giữ cả hai để một lượt chạy so được chúng với nhau, và để dataset
  # cũ tham chiếu `photocopy` theo tên vẫn ra đúng thứ nó vẫn ra.
  - id: photocopy_screened
    enabled: true
    weight: 3
    excludes: [thermal]     # không ai photo một tờ giấy nhiệt: nó tự phai
    tags: [textured, screened]
    params:
      chain:
        - [paper_texture, {alpha: 0.28, grain: 0.4}]
        # Kịch bản này là kịch bản duy nhất chưa bao giờ gọi `ink_degradation`
        # — lưới tram đã là hỏng mực rồi, nó băm nét chữ thành chấm, chồng thêm
        # mòn mực lên thì chữ không còn đọc được. Nay cả mười lăm kịch bản kia
        # cũng bỏ nó: xem `degradation.SWITCHED_OFF`.
        - [halftone_screen, {cell: 4.2, angle: 45, strength: 0.5}]
        # Tram trước, nhoè sau: máy photo tạo chấm rồi ống kính mới làm mềm
        # mép chấm. Ngược lại thì ra chấm sắc trên nền đã nhoè, không máy nào
        # cho ra như thế.
        - [blur, {radius: 0.6}]
        # Trống mực xước in lại vết ấy mỗi vòng quay → sọc LIỀN chạy dọc
        # tờ giấy. Sọc đứt quãng là nhiễu; sọc liền là cái trống.
        - [dirty_drum, {lines: 4, direction: vertical, intensity: 0.30,
                        line_width: 2}]
        - [scan_banding, {period: 46, amplitude: 0.045}]
        - [monochrome, {}]

  - id: photocopy_stamped
    enabled: true
    weight: 2
    excludes: [thermal]
    tags: [textured, screened]
    params:
      chain:
        - [paper_texture, {alpha: 0.30, grain: 0.45}]
        - [halftone_screen, {cell: 3.6, angle: 45, strength: 0.7}]
        - [blur, {radius: 0.7}]
        - [bad_photocopy, {blotch: 0.38, wash: 0.26, contrast: 0.35, cell: 44}]
        - [dirty_drum, {lines: 6, direction: vertical, intensity: 0.42,
                        line_width: 3}]
        # Dấu đóng lên bản photo, nên nó nằm TRÊN lưới tram chứ không bị tram
        # hoá cùng trang.
        - [pattern_overlay, {pattern: seal_square_copy, scale: 0.34,
                             opacity: 0.55, anchor: bottom_right, rotate: 8}]
        - [scan_banding, {period: 34, amplitude: 0.06}]
        # Cuối cùng, SAU cả con dấu. Comment ở `pattern_overlay` trên nói
        # dấu được đóng lên bản photo — nếu vậy nó giữ mực xanh thật và
        # dòng này nên nằm TRƯỚC nó. Để sau vì yêu cầu là cả ảnh phải
        # xám; đổi chỗ một dòng là quay về cách kia.
        #
        # `warmth: 0`, không phải một chút ám vàng cho ra dáng giấy cũ. Đo
        # được: `warmth: 0.25` để lại chroma khác 0, và JPEG 4:2:0 dội quanh
        # các chấm tram thành viền BÃO HOÀ 255 trên 0,5-0,7% pixel — tức tấm
        # ảnh không còn là greyscale nữa dù mắt thường không thấy. Muốn giấy
        # ngả vàng thì làm ở `paper_texture`, nơi nó không đi qua chroma.
        - [monochrome, {}]

  - id: flatbed_scan
    weight: 3
    tags: [textured, scanned]
    params:
      chain:
        - [paper_texture, {alpha: 0.24, grain: 0.35}]
        - [scan_banding, {period: 30, amplitude: 0.07, tilt: 1.5}]
        - [blur_zones, {radius: 1.1, zones: 2, coverage: 0.16}]
        - [jpeg_blocks, {quality: 42, passes: 1}]

  - id: forwarded_photo
    weight: 3
    tags: [textured, recompressed]
    params:
      chain:
        - [paper_texture, {alpha: 0.30, grain: 0.5}]
        - [blur_zones, {radius: 1.4, zones: 2, coverage: 0.20}]
        # Ảnh chụp điện thoại rồi chuyển tiếp mấy chặng: mỗi chặng nén lại một
        # lần, sai số dồn lên lưới 8×8 chứ không chỉ làm ảnh mờ đi.
        - [jpeg_blocks, {quality: 30, passes: 3}]

  # --------------------------------------------------------------------
  # CHUYỂN THỂ TỪ AUGRAPHY — chín mô hình ở đây, ba mô hình thành thuộc tính riêng
  #
  # Nguồn: https://github.com/sparkfish/augraphy. Mã của họ không được vendor;
  # từng mô hình viết lại trong `degradation/` và ghi rõ chuyển thể từ file nào
  # (`copier.py`, `printing.py`, `marks.py`, `tessellation.py`, `channel.py`).
  #
  # Chín kịch bản dưới đây lấp ba chỗ trống mà `docs/lam-cu-de-xuat.md` đã đếm:
  #
  #   * mực HỎNG LÚC IN, không phải mòn theo thời gian — `letterpress`,
  #     `hollow`, `dot_matrix`. `ink_degradation` của DocCreator tả tờ giấy in
  #     xong rồi mục đi; ba cái này tả tờ giấy chưa bao giờ được in cho tử tế.
  #     (`ink_degradation` nay đã tắt — `degradation.SWITCHED_OFF`.)
  #
  # Ba mô hình còn lại của đợt ấy — `bad_photocopy`, `dirty_drum`,
  # `dirty_rollers` — KHÔNG có mặt trong file này. Chúng từng là ba thuộc
  # tính riêng (`toner`, `drum`, `rollers` trong `_order.yaml`) mô phỏng cái
  # máy đã sao tờ giấy, độc lập với `augmentation` — đã bị xoá hẳn khỏi
  # rule-base vì cả ba chỉ còn đúng một giá trị "tắt" mỗi file, không còn gì
  # để LLM/coverage-sampler thật sự chọn. Ba mô hình vẫn còn trong
  # `degradation/` nhưng không được đăng ký ở đâu nữa — bật lại đồng nghĩa
  # với việc thêm cả thuộc tính lẫn giá trị hỏng lại, không chỉ gọi tên chúng
  # ở đây, vì gói chúng vào một giá trị ở đây thì mỗi tổ hợp phải viết tay
  # một kịch bản, và số kịch bản phải viết là TÍCH chứ không phải tổng.
  #   * nhiễu MÀU. Mười sáu mô hình trước đó đều chỉ đổi độ sáng, nên một mô
  #     hình OCR học trên bộ này gặp viền màu lần đầu ở ảnh thật.
  #   * nét NGƯỜI THÊM VÀO — bút dạ quang, khoanh tròn, gạch xoá, nguệch ngoạc.
  #
  # ------------------------------------------------------------------
  # `by_box` LÀ CHỖ ĐÁNG ĐỌC NHẤT TRONG KHỐI NÀY.
  #
  # Mọi mô hình phía trên file này áp ĐỀU khắp mặt giấy. Trên ảnh thật thì gần
  # như không hỏng nào như thế: cây bút chỉ tô một dòng, cái kim gãy chỉ ăn một
  # dải ngang, người ta chỉ khoanh tròn ô "Tổng cộng". `by_box` bọc một mô hình
  # bất kỳ và chỉ cho nó ăn vào vài ô chữ:
  #
  #   - [by_box, {effect: <tên mô hình>,
  #               params: {<tham số của mô hình ấy>},
  #               select: {policy: <lối bốc>, <tham số của lối bốc>}}]
  #
  # Sáu lối bốc, và khác nhau ở HÌNH DẠNG chứ không ở số lượng:
  #   scatter  rải rác, không quan tâm ô nào cạnh ô nào  (`fraction` | `count`)
  #   run      một đoạn LIỀN NHAU theo thứ tự đọc       (`fraction` | `length`)
  #   band     mọi ô cắt qua một dải NGANG              (`thickness`, `count`)
  #   column   mọi ô cắt qua một dải DỌC                (`thickness`, `count`)
  #   kind     bốc theo VAI TRÒ ô, khớp theo tiền tố    (`kinds`, `fraction`)
  #   all      mọi ô có chữ — vẫn khác cả trang: lề và khoảng trống không dính
  #
  # `kinds: [total]` trúng cả `total.grand` lẫn `total.line`; xem `_kind_matches`
  # trong `degradation/regions.py`. Bốc ra rỗng KHÔNG phải lỗi — một tờ không có
  # ô tổng cộng thì đi qua nguyên vẹn.

  - id: impact_ribbon
    weight: 2
    requires: [impact]        # chỉ máy in kim mới in ra lưới chấm này
    tags: [textured, dot_printed]
    params:
      chain:
        - [paper_texture, {alpha: 0.32, grain: 0.5}]
        # Hai kim gãy: mỗi cái để lại một vạch trắng ngang chạy suốt mọi dòng,
        # đúng một độ cao trong mỗi ký tự. Nhiễu CÓ CẤU TRÚC, nên mô hình học
        # được nó — khác hẳn nhiễu rắc ngẫu nhiên.
        - [dot_matrix, {cell: 2.8, shape: circle, coverage: 0.78,
                        strength: 0.8, dead_pins: 2, ribbon: 0.25}]
        - [blur, {radius: 0.5}]
        - [scan_banding, {period: 42, amplitude: 0.04}]

  - id: worn_plate
    weight: 2
    tags: [textured, hollowed]
    params:
      chain:
        - [paper_texture, {alpha: 0.3, grain: 0.45}]
        # Bản in ăn mực kém: nét rỗ hoa khắp trang...
        - [letterpress, {clusters: 260, spread: 5.0, dots: 14, strength: 0.65}]
        # ...còn rỗng ruột thì chỉ ở VÀI DÒNG. Ruy băng khô không khô đều cả
        # trang; nó khô ở đoạn nó nằm lâu nhất. Đây là chỗ `by_box` kiếm được
        # tiền: cùng một mô hình, áp cả trang thì ra tờ giấy không ai in nổi.
        - [by_box, {effect: hollow, params: {strength: 0.8},
                    select: {policy: run, fraction: 0.18}}]
        - [blur_zones, {radius: 1.0, zones: 2, coverage: 0.14}]

  - id: annotated
    weight: 2
    tags: [textured, annotated]
    params:
      chain:
        - [paper_texture, {alpha: 0.28, grain: 0.4}]
        - [paper_overlay, {alpha: 0.26, lighten: 0.32}]
        # Người đọc tô mấy dòng LIỀN NHAU, không tô ba dòng cách quãng.
        - [by_box, {effect: markup, params: {style: highlight, opacity: 0.7},
                    select: {policy: run, fraction: 0.08}}]
        # Và khoanh tròn đúng ô tiền. `kinds: [total]` trúng cả `total.grand`
        # lẫn `total.line`; tờ nào không có ô tổng cộng thì bước này không làm
        # gì, chứ không hỏng.
        - [by_box, {effect: markup, params: {style: circle, colour: red},
                    select: {policy: kind, kinds: [total], fraction: 0.6}}]
        - [blur_zones, {radius: 1.0, zones: 1, coverage: 0.12}]

  - id: scribbled
    weight: 3
    tags: [textured, annotated, dirty]
    params:
      chain:
        - [paper_texture, {alpha: 0.34, grain: 0.5}]
        # Gạch xoá một dòng ghi sai. `crossed_off` là mô hình DUY NHẤT ở đây
        # được phép che chữ — và một ô bị gạch xoá vẫn mang nhãn khai đủ chữ,
        # nên `count: 1` chứ không phải một phần trăm của trang.
        - [by_box, {effect: markup, params: {style: crossed_off, colour: blue},
                    select: {policy: scatter, count: 1}}]
        - [by_box, {effect: scribbles, params: {turns: 8, opacity: 0.75},
                    select: {policy: scatter, count: 2}}]
        - [blur_zones, {radius: 1.2, zones: 2, coverage: 0.16}]

  - id: security_paper
    weight: 1
    requires: [doc_invoice]   # hoá đơn đặt in mới có nền bảo an
    tags: [textured, patterned]
    params:
      chain:
        - [paper_texture, {alpha: 0.22, grain: 0.3}]
        # Nền chia ô in chìm. `alpha` để thấp vì đây là nền BẢO AN, không phải
        # vết bẩn: nó phải thấy được mà không lấn chữ. Trên 0.3 thì mô hình OCR
        # bắt đầu nhận hoạ tiết nền thành ký tự, tức là đang dạy điều ngược lại
        # với điều muốn dạy.
        - [voronoi_tessellation, {scale: 30, alpha: 0.15, contrast: 0.6, edges: 0.08}]
        - [blur_zones, {radius: 1.0, zones: 2, coverage: 0.14}]

  - id: security_guilloche
    weight: 1
    requires: [doc_invoice]
    tags: [textured, patterned]
    params:
      chain:
        - [paper_texture, {alpha: 0.22, grain: 0.3}]
        - [paper_overlay, {alpha: 0.24, lighten: 0.34}]
        # Delaunay là đối ngẫu của Voronoi trên cùng tập điểm sinh, nhưng phủ
        # lên trang thì đọc ra khác hẳn: mảng tam giác nhọn giống nền in trang
        # trí, ô Voronoi giống thớ giấy. Giữ cả hai để một lượt chạy so được.
        - [delaunay_tessellation, {scale: 42, alpha: 0.13, contrast: 0.5}]

  # Ảnh chụp LẠI MÀN HÌNH. Hoá đơn điện tử mở trên máy tính rồi chụp bằng điện
  # thoại — loại ảnh đang tăng nhanh nhất, và trước đợt này không mô hình nào
  # trong repo sinh ra nổi. Ba dấu vết cùng lúc: viền màu của subpixel RGB, dải
  # xé của màn hình đang quét, và nén lại khi gửi đi.
  - id: screen_photo
    weight: 2
    excludes: [thermal]
    tags: [textured, recompressed, misregistered]
    params:
      chain:
        - [paper_texture, {alpha: 0.18, grain: 0.25}]
        - [color_shift, {shift: 1.3, blur: 0.4}]
        # `max_shift` để rất nhỏ, và đó là một quyết định về NHÃN chứ không về
        # thẩm mỹ: `glitch_effect` là mô hình duy nhất trong repo làm pixel đổi
        # chỗ, nên chữ trong dải bị dịch lệch khỏi hộp nhãn của nó. 0.003 bề
        # rộng trang là dưới nửa bề rộng một ký tự — hộp vẫn phủ gần hết nét.
        # Đọc docstring của nó trước khi nâng con số này.
        - [glitch_effect, {bands: 4, max_shift: 0.003, separation: 0.6}]
        - [scan_banding, {period: 22, amplitude: 0.05}]
        - [jpeg_blocks, {quality: 34, passes: 2}]

  - id: misregistered
    weight: 1
    excludes: [thermal]       # giấy nhiệt in một màu, không có bản để lệch
    tags: [textured, misregistered]
    params:
      chain:
        - [paper_texture, {alpha: 0.3, grain: 0.45}]
        - [paper_overlay, {alpha: 0.28, lighten: 0.3}]
        # `radial: 1` là quang sai ống kính — lệch tăng dần theo bán kính, giữa
        # ảnh chồng khít còn bốn góc lệch nhất. `radial: 0` là lệch bản in, đều
        # khắp tờ. Hai cơ chế khác nhau, và đây là cái của ống kính.
        - [color_shift, {shift: 2.0, radial: 1.0, blur: 0.5}]
        - [blur_zones, {radius: 1.2, zones: 2, coverage: 0.16}]

  # --------------------------------------------------------------------
  # HÌNH HỌC — tờ giấy không còn PHẲNG, không chỉ cũ
  #
  # Mọi giá trị phía trên chỉ đổi MÀU/KẾT CẤU pixel; `chain` của chúng bị cấm
  # dịch chuyển pixel (xem `generators/html/render.py`'s kiểm tra ngay sau
  # `apply_recipe`). Ba giá trị dưới đây là chỗ duy nhất một trang được phép
  # cong -- qua `params.warp`, đọc riêng bởi `render.py` SAU chuỗi `chain` và
  # SAU kiểm tra ấy, rồi áp bằng `degradation.blender.warp_regions` lên cả ba
  # tập hộp của trang (`boxes`, `words`, `cells`) cùng lúc.
  #
  # Bước này RENDER THẬT qua Blender -- mesh giấy cong (numpy, xem
  # `degradation/blender/meshes.py`), vật liệu giấy, camera phối cảnh và ánh
  # sáng thật (vendor từ github.com/tanguymagne/SyntheticDoc, MIT, xem
  # `degradation/blender/vendor/NOTICE.md`). Không phải mô phỏng lại: bản đầu
  # của ba giá trị này là warp pixel 2D thuần numpy, và so với ảnh mẫu của
  # SyntheticDoc thì thiếu đúng phần làm nó ĐỌC RA là giấy cong -- phối cảnh
  # thật và bóng đổ theo pháp tuyến bề mặt thật, không xấp xỉ được bằng cách
  # tô lại pixel. ARCSim (mô phỏng vật lý của SyntheticDoc) KHÔNG được dùng --
  # giấy phép phi thương mại; mesh biến dạng ở đây là mặt cong giải tích dựng
  # bằng numpy, không mô phỏng vật lý gì. Xem `degradation/blender/meshes.py`'s
  # docstring.
  #
  # `warp.name` là một khoá của `degradation.blender.meshes.MESHES`; `warp.params`
  # truyền thẳng vào hàm dựng mesh ấy, mỗi tham số nhận số cố định hoặc
  # `(low, high)`. Chi phí: một lượt gọi Blender, vài giây tới hơn một phút một
  # trang -- không phải milli-giây như mọi model khác trong `degradation/`.
  #
  # `enabled: false` cả ba: đã nối dây đủ (rule-base, renderer, test), nhưng
  # ĐÃ soát bằng ảnh thật, và lượt soát ấy tìm ra hai lỗi chứ không phải một
  # con số biên độ cần vặn:
  #
  #   1. Blender dựng trên canvas 1536x2048 rồi crop về đúng bóng trang. Camera
  #      phải lùi ra cho nếp gấp lọt khung, nên trang chỉ chiếm một phần khung:
  #      A4 vào 1191x1684, ra 803x1036 -- hai phần ba kích thước thẳng. Mọi
  #      glyph co theo, chữ 8pt tụt dưới ngưỡng `chu_nho`. Warp được phép BẺ
  #      CONG trang, không được phép hạ độ phân giải của nó; `degradation/
  #      blender/render.py` nay phóng lại sao cho không trục nào mất pixel.
  #   2. `agent/critic.py::overlaps` đo chồng lấn bằng HỘP BAO. Một dòng chữ
  #      trên trang cong là hình bình hành nghiêng, hộp bao to hơn hẳn vệt mực,
  #      nên hai dòng kề nhau "đè" nhau mà thân không chạm. Nay cắt đa giác
  #      thật (Sutherland-Hodgman); hộp bao chỉ còn làm bộ lọc rẻ cho phép
  #      quét.
  #
  # Đo lại sau hai sửa ấy, một trang mỗi kịch bản, mọi trục khác ghim cứng:
  # `page_curl`, `folded`, `lifted_corner`, `crease_bundle`, `crumple`,
  # `paper_creased` -- **0 lỗi nặng, 0 lỗi nhẹ** cho cả sáu. Trước đó lần lượt
  # là 12, 11, 12, 7, 3 và 0.
  #
  # Dịch chuyển hộp, tính theo % đường chéo trang (trung vị / tối đa):
  # paper_creased 0,5/1,2 · crease_bundle 4,0/6,4 · crumple 4,8/7,8 ·
  # folded 6,6/14,9 · lifted_corner 9,5/15,0 · page_curl 7,9/19,7.
  #
  # Chi phí thời gian ở trên vẫn đúng: vài giây tới hơn một phút một trang, so
  # với vài milli-giây của `paper_photo`. Trọng số của bốn giá trị này để thấp
  # vì lý do đó, không phải vì chất lượng. Cần Blender cài sẵn --
  # `make setup-blender`.

  # `paper_photo` KHÔNG qua Blender: trường dịch chuyển đọc thẳng từ ẢNH CHỤP
  # GIẤY trong `augmentations/data/image/` (độ sáng = độ cao), rồi CHÍNH tấm
  # ảnh ấy phủ lên trên. Một lượt vài milli-giây thay vì vài giây tới hơn một
  # phút, nên đây là giá trị warp duy nhất BẬT mặc định.
  #
  # Hai nửa dùng CÙNG một bản crop: nếp gấp nhìn thấy đúng là nếp gấp đã bẻ
  # pixel. Vì thế `chain` ở đây KHÔNG có `paper_overlay` -- gọi thêm là bốc
  # ảnh giấy lần hai, bóng nếp gấp rơi lệch khỏi chỗ vừa bẻ.
  #
  # `max_stretch` chặn BIẾN DẠNG CỤC BỘ (|det(J) - 1|), không chặn số pixel
  # dịch chuyển -- xem docstring `degradation/paper_warp.py`. Ở 0.28, đo trên
  # sáu layout trong `data/paper_warp_test/`: det(J) 0.746..1.295, pixel dịch
  # tới ~33px trên trang 1020x2289 mà không trang nào rách chữ. Muốn cong hơn
  # thì vặn số này; qua ~0.5 là bắt đầu phải soát lại bằng mắt.
  # ---- GIẤY VÒ MÔ PHỎNG: giá trị DUY NHẤT ở đây phá được chữ ----
  #
  # Đo trên cùng một trang mẫu 60 hộp (`tools/legibility.py`):
  #
  #     engine                        méo tối đa   hộp hỏng   hộp bị che
  #     paper_photo                        ~1.0       0/60         0/60
  #     blender (mesh giải tích)           1.46       0/60         0/60
  #     simulated_paper (ARCSim)          14.42      24/60        53/60
  #
  # Hai engine đầu KHÔNG THỂ phá chữ, và đó là do cấu trúc chứ không do may:
  # `paper_photo` chặn Jacobian; `blender/meshes.py` dựng mặt KHẢ TRIỂN (bảo
  # toàn độ dài cung, nên nếp gấp không kéo giãn được thứ in trên nó) và
  # `vendor/camera_angle_sampler.py` TỪ CHỐI mọi góc máy không thấy trọn tờ --
  # đo được: `crumple` ở biên độ 0.030, gấp đôi mức đang ship, bị từ chối sau
  # sáu lần thử.
  #
  # Giấy vò thật thì khác hẳn về bản chất: mặt không khả triển, giấy gập lên
  # chính nó, và mảng này che mảng kia. `simulated_paper` là engine duy nhất
  # trả về `legible: false` cho những hộp bị che -- đầu vào mà assertion
  # `illegible_silence` cần, và là thứ không mô hình lọc pixel nào giả được.
  #
  # `meshes` ĐỂ TRỐNG trong repo, và trống thì bước này là no-op. Mesh không
  # nằm trong kho: chúng do người vận hành tự mô phỏng, và bộ mesh đã dùng để
  # dựng/đo cái này ra từ ARCSim -- giấy phép CHỈ CHO giáo dục, nghiên cứu,
  # phi lợi nhuận (xem `degradation/blender/vendor/NOTICE.md`). **Dataset
  # thương mại không được xây trên output ARCSim khi chưa có giấy phép thương
  # mại của Berkeley.** Engine chỉ đọc `.obj`, không quan tâm ai sinh ra.
  #
  # `frame` là NÚM ĐỘ KHÓ, và là thứ đáng chỉnh nhất ở đây: 0 = tờ phẳng,
  # 1 = vò nát thành cục. Đo trên 118 frame của một lượt ARCSim crumple:
  # 0.25 -> 60/60 hộp đọc được, 0.70 -> 31/60, 0.99 -> 10/60. Khoảng 0.55-0.80
  # là chỗ trang vừa hỏng thật vừa còn phần lớn nhãn dùng được.
  #
  # Giá: 0,2-4 giây một trang (numpy, tự chiếu và tô), so với vài phút của
  # đường Blender. `enabled: false` vì `meshes` trống, không vì chi phí.
  - id: simulated_crumple
    enabled: false
    weight: 1
    tags: [textured, warped, creased]
    params:
      chain:
        - [paper_texture, {alpha: 0.32, grain: 0.5}]
      warp:
        name: simulated_paper
        params:
          meshes: ""          # thư mục .obj đã mô phỏng; trống = no-op
          frame: [0.55, 0.80]
          elev: [-22.0, 22.0]
          azim: [-22.0, 22.0]
          shade: 0.55

  - id: paper_creased
    enabled: true
    weight: 3
    tags: [textured, warped, creased]
    params:
      chain:
        - [paper_texture, {alpha: 0.32, grain: 0.5}]
      warp:
        name: paper_photo
        params:
          max_stretch: [0.22, 0.28]
          alpha: 0.38
          lighten: 0.35

  - id: page_curl
    enabled: true
    weight: 2
    tags: [textured, warped]
    params:
      chain:
        - [paper_texture, {alpha: 0.32, grain: 0.5}]
      warp:
        name: page_curl
        params:
          angle: [20.0, 45.0]

  - id: folded
    enabled: true
    weight: 2
    tags: [textured, warped, creased]
    params:
      chain:
        - [paper_texture, {alpha: 0.35, grain: 0.55}]
        - [blur_zones, {radius: 1.0, zones: 1, coverage: 0.10}]
      warp:
        name: fold_crease
        params:
          axis: x
          position: [0.35, 0.65]
          angle: [25.0, 55.0]
          crease_width_ratio: [0.03, 0.06]

  - id: lifted_corner
    enabled: true
    weight: 1
    tags: [textured, warped]
    params:
      chain:
        - [paper_texture, {alpha: 0.30, grain: 0.45}]
        - [shadow_binding, {border: bottom, distance_ratio: 0.08, intensity: 0.3}]
      warp:
        name: corner_bulge
        params:
          radius_ratio: [0.3, 0.5]
          depth: [0.02, 0.05]

  # Hai giá trị dưới đây KHÔNG tương ứng scenario "thả rơi xuống vật cản"
  # (`fall_on_ball`/`fall_on_roller`/`fall_on_roof`) của SyntheticDoc -- chỉ
  # `lifted_corner` ở trên mượn hình dáng đó (một góc phồng, kiểu `fall_on_
  # ball`). Đây là biến dạng BỀ MẶT thuần: nhiều nếp gấp cắt nhau
  # (`crease_bundle`) hoặc nhàu rải rác (`crumple`, xấp xỉ phẳng của
  # `fall_on_many` -- xem docstring hai hàm trong `degradation/blender/
  # meshes.py` cho lý do đây không phải cùng một phép dựng với `fold_crease`).
  # `angles` (độ) ép mỗi crease vào một hướng cụ thể thay vì để rơi ngẫu nhiên
  # trong [0, 180) -- [0, 90, 45, 135] đảm bảo luôn có đủ dọc, ngang VÀ hai
  # chéo cắt nhau, thay vì trông cậy vào may rủi để có "đan xen" thật. `profile:
  # sharp` (thay `gaussian` mặc định) đổi dạng lát cắt mỗi nếp từ gò tròn sang
  # có gãy khúc thật ở đỉnh (`exp(-|x|)` thay vì `exp(-x^2)`) -- xem docstring
  # `crease_bundle` trong meshes.py. `depth`/`width_ratio` ở đây NÔNG và RỘNG
  # hơn mặc định của hàm cố tình: bốn nếp cắt nhau + `profile: sharp` cùng làm
  # tăng độ cong cục bộ, khiến camera-visibility-check (degradation/blender/
  # vendor/camera_angle_sampler.py) phải lùi xa hơn để qua -- giá trị này đã đo
  # bằng mắt trên `medical_statement` (data/paper_warp_test/) là mức vừa đủ để
  # còn ra ảnh đọc được (~1100x530) chứ không co lại còn vài trăm pixel.
  - id: crease_bundle
    enabled: true
    weight: 1
    tags: [textured, warped, creased]
    params:
      chain:
        - [paper_texture, {alpha: 0.35, grain: 0.55}]
        - [blur_zones, {radius: 1.0, zones: 2, coverage: 0.12}]
      warp:
        name: crease_bundle
        params:
          n_creases: 4
          angles: [0, 90, 45, 135]
          profile: sharp
          depth: [0.006, 0.012]
          width_ratio: [0.05, 0.08]

  - id: crumple
    enabled: true
    weight: 1
    tags: [textured, warped, creased]
    params:
      chain:
        - [paper_texture, {alpha: 0.40, grain: 0.6}]
        - [blur_zones, {radius: 1.1, zones: 3, coverage: 0.16}]
      warp:
        name: crumple
        params:
          n_bumps: [10, 16]
          amplitude: [0.006, 0.012]
          radius_ratio: [0.07, 0.13]
