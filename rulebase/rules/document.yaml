# THUỘC TÍNH 1/6 — LOẠI DOCUMENT
#
# Bốc trước tiên, nên đây là chỗ quyết định "tờ giấy này là cái gì". Mọi thuộc
# tính sau đều nhìn thấy `tags` mà giá trị ở đây gắn vào, và dùng
# requires/excludes để tự loại mình ra nếu không hợp.
#
# weight = tần suất tương đối. Muốn nhiều hoá đơn siêu thị hơn thì tăng weight
# của mấy dòng doc_market, không phải sửa code.
#
# params đi thẳng vào `rulebase.content.build`.
#
# `id` và `tags` viết bằng TIẾNG ANH — chúng là định danh trong code. Chỉ chuỗi
# thật sự ĐƯỢC IN LÊN hoá đơn (`titles`, `total_labels`) mới giữ tiếng Việt.

options:
  - id: pub_eatery
    weight: 3
    tags: [doc_eatery, has_table_no]
    params:
      profile: eatery
      titles: ["PHIẾU THANH TOÁN", "HOÁ ĐƠN THANH TOÁN", "PHIẾU TÍNH TIỀN"]
      num_items: [3, 14]
      prob_table: 0.85
      total_labels:
        subtotal: "Tiền hàng"
        grand: "Thanh toán"
        change: "Tiền thối lại"

  - id: street_eatery
    weight: 3
    tags: [doc_eatery]
    params:
      profile: eatery
      titles: ["PHIẾU TÍNH TIỀN", "HOÁ ĐƠN", "PHIẾU THANH TOÁN"]
      num_items: [2, 10]
      prob_table: 0.45
      total_labels:
        subtotal: "Tạm tính"
        grand: "Tiền mặt"
        change: "Tiền thối lại"

  - id: restaurant_vat
    weight: 2
    tags: [doc_eatery, has_vat]
    params:
      profile: eatery
      titles: ["HOÁ ĐƠN GTGT", "PHIẾU THANH TOÁN", "HOÁ ĐƠN BÁN HÀNG"]
      num_items: [4, 16]
      prob_table: 0.7
      vat_rates: [8, 10]
      total_labels:
        subtotal: "Cộng tiền hàng"
        vat: "Thuế GTGT"
        grand: "Tổng thanh toán"
        change: "Tiền trả lại"

  - id: supermarket
    weight: 3
    tags: [doc_market, has_barcode, has_vat]
    params:
      profile: market
      titles: ["HOÁ ĐƠN BÁN HÀNG", "PHIẾU TÍNH TIỀN"]
      num_items: [3, 12]
      vat_rates: [8, 10]
      show_tax_code: false
      total_labels:
        subtotal: "TỔNG TIỀN PHẢI T.TOÁN"
        discount: "TỔNG TIỀN ĐÃ GIẢM"
        grand: "TIỀN KHÁCH TRẢ"
        change: "TIỀN TRẢ LẠI"

  - id: convenience_store
    weight: 2
    tags: [doc_market, has_promo]
    params:
      profile: market
      titles: ["PHIẾU TÍNH TIỀN", "HOÁ ĐƠN BÁN HÀNG"]
      num_items: [2, 8]
      show_tax_code: true
      total_labels:
        subtotal: "TỔNG GIÁ TRỊ ĐƠN"
        discount: "TỔNG TIỀN GIẢM"
        grand: "TỔNG TIỀN THANH TOÁN"
        change: "Tiền trả lại"

  - id: supermarket_vat
    weight: 2
    tags: [doc_market, has_barcode, has_vat, has_vat_lines]
    params:
      profile: market
      titles: ["PHIẾU TÍNH TIỀN", "HOÁ ĐƠN GTGT"]
      num_items: [3, 10]
      vat_rates: [8, 10]
      total_labels:
        subtotal: "Tổng tiền"
        discount: "Tổng tiền giảm giá"
        vat: "Thuế GTGT"
        grand: "Tiền khách trả"
        change: "Tiền trả lại cho khách"

  # --------------------------------------------------------------------
  # HOÁ ĐƠN GTGT — tờ A4, không phải giấy nhiệt.
  #
  # `invoice: true` là công tắc: `rulebase.content` thấy nó thì dựng thêm
  # phần hoá đơn (hai bên mua/bán, ký hiệu + số, số tiền bằng chữ, chữ ký) và
  # BỎ khối `meta` của máy tính tiền. `party_fields` liệt kê trường nào có mặt
  # và nhãn của nó — nhãn là chữ IN LÊN GIẤY nên viết tiếng Việt.

  - id: vat_invoice_form
    weight: 2
    tags: [doc_invoice, has_vat, invoice_form]
    params:
      profile: invoice
      invoice: true
      titles: ["HOÁ ĐƠN GIÁ TRỊ GIA TĂNG", "HOÁ ĐƠN GTGT"]
      num_items: [2, 6]
      price_step: 1000
      vat_rates: [5, 8, 10]
      item_vat: true
      show_form_no: true
      show_seller_account: true
      units: ["Cái", "Bộ", "Chiếc", "Kg", "Tháng", "Gói", "Thùng", "m2", "Lượt"]
      subtitle: "(Bản thể hiện của hoá đơn điện tử)"
      period_format: "Ngày {date}"
      words_label: "Số tiền viết bằng chữ:"
      party_fields:
        left:
          - [buyer_name, "Tên người mua hàng:"]
          - [buyer_tax_code, "Mã số thuế:"]
          - [buyer_address, "Địa chỉ:"]
          - [payment_form, "Hình thức thanh toán:"]
          - [buyer_account, "Số tài khoản:"]
      payment_forms: ["Tiền mặt", "Chuyển khoản", "Tiền mặt/Chuyển khoản"]
      signature_labels:
        - ["NGƯỜI MUA HÀNG", "(Chữ ký số (nếu có))"]
        - ["NGƯỜI BÁN HÀNG", "(Chữ ký điện tử, chữ ký số)"]
      digital_signature: true
      total_labels:
        subtotal: "Cộng tiền hàng chưa có thuế GTGT"
        vat: "Tổng số tiền thuế giá trị gia tăng"
        grand: "Tổng tiền thanh toán đã có thuế GTGT"

  - id: utility_water
    weight: 2
    tags: [doc_invoice, doc_utility, has_vat, metered_water]
    params:
      profile: utility_water
      invoice: true
      metered: true
      titles: ["HOÁ ĐƠN GIÁ TRỊ GIA TĂNG (TIỀN NƯỚC)"]
      num_items: [1, 3]
      price_step: 1
      qty_range: [3, 46]
      vat_rates: [5]
      tier_codes: ["SH", "DV", "HC", "SX"]
      subtitle: "(Bản thể hiện của hoá đơn điện tử)"
      period_format: "Tháng {month} năm {year}"
      # Phí bảo vệ môi trường tính trên tiền hàng, in thành một dòng riêng và
      # cộng vào số phải trả — xem ảnh mẫu Nước sạch Hà Nội.
      surcharges:
        - ["Phí BVMT đối với nước thải SH 10%", 0.10]
      party_fields:
        left:
          - [buyer_name, "Tên khách hàng:"]
          - [buyer_address, "Địa chỉ:"]
          - [buyer_account, "Tài khoản:"]
          - [buyer_tax_code, "Mã số thuế:"]
          - [usage_period, "Thời gian sử dụng:"]
        right:
          - [invoice_code, "Mã hoá đơn:"]
          - [buyer_code, "Mã số khách hàng:"]
          - [households, "Số hộ sử dụng:"]
          - [meter, "Khối - Số đọc:"]
      signature_labels:
        - ["Người mua hàng", "(Ký, ghi rõ họ , tên)"]
        - ["Người bán hàng", "(Ký, đóng dấu, ghi rõ họ, tên)"]
      digital_signature: true
      total_labels:
        subtotal: "Cộng tiền hàng"
        vat: "Thuế suất"
        grand: "Tổng tiền thanh toán"

  - id: utility_power
    weight: 2
    tags: [doc_invoice, doc_utility, has_vat, metered_power]
    params:
      profile: utility_power
      invoice: true
      metered: true
      titles: ["HOÁ ĐƠN GIÁ TRỊ GIA TĂNG (TIỀN ĐIỆN)"]
      num_items: [2, 5]
      price_step: 1
      qty_range: [18, 240]
      vat_rates: [8, 10]
      tier_codes: ["SH", "KD", "SX"]
      subtitle: "(Bản thể hiện của hoá đơn điện tử)"
      period_format: "Kỳ hoá đơn: Tháng {month} năm {year}"
      party_fields:
        left:
          - [buyer_name, "Khách hàng:"]
          - [buyer_address, "Địa chỉ:"]
          - [buyer_tax_code, "Mã số thuế:"]
          - [usage_period, "Từ ngày - đến ngày:"]
        right:
          - [buyer_code, "Mã khách hàng:"]
          - [meter, "Số công tơ:"]
          - [invoice_code, "Mã tra cứu hoá đơn:"]
          - [consumption, "Điện tiêu thụ (kWh):"]
      signature_labels:
        - ["Người mua điện", "(Ký, ghi rõ họ tên)"]
        - ["Bên bán điện", "(Ký, đóng dấu, ghi rõ họ tên)"]
      digital_signature: true
      total_labels:
        subtotal: "Cộng tiền điện"
        vat: "Thuế GTGT"
        grand: "Tổng cộng tiền thanh toán"

  # Hoá đơn tiếng Anh. Là loại document RIÊNG chứ không phải bản dịch: corpus
  # của nó nằm ở `rulebase/corpus/en/`, và `lang: en` là chỗ nói điều đó.
  - id: tax_invoice_en
    weight: 1
    tags: [doc_invoice, has_vat, lang_en]
    params:
      profile: invoice
      invoice: true
      lang: en
      titles: ["Tax Invoice"]
      serial_format: "INV-{year}-{n}"
      num_items: [2, 7]
      price_step: 1
      vat_rates: [10]
      item_vat: true
      show_amount_words: false
      show_seller_account: true
      # No `units:`: `invoice_tax_en` has no "Đơn vị tính" column, and a unit
      # nothing prints is a field in the label that no reader can check.
      address_format: "{number} {street}, {ward} {district}"
      phone_label: "Phone:"
      currency: "AUD"
      period_format: "Date invoiced: {date}"
      subtitle: "Due On Invoice"
      party_fields:
        left_title: "Ship to"
        left:
          - [ship_name, ""]
          - [ship_address, ""]
          - [ship_locality, ""]
        right_title: "Billed to"
        right:
          - [buyer_name, ""]
          - [buyer_address, ""]
          - [buyer_locality, ""]
          - [due_date, "Date Due:"]
      surcharges:
        - ["Express Shipping", 0.07]
      notes:
        - "Payment Options:"
        - "Credit Card - Master Card, Visa"
        - "Direct Bank Deposit or Internet Transfer"
        - "BSB xxxx, Account Number: {seller_account}"
        - "Money Order or Cheque - payable to {seller_name}"
      total_labels:
        subtotal: "Product Subtotal"
        vat: "GST included"
        grand: "Grand Total"

  # --------------------------------------------------------------------
  # HOÁ ĐƠN GTGT CÓ BẢNG "TỔNG HỢP" — bản thể hiện của hoá đơn điện tử.
  #
  # Khác `vat_invoice_form` ở chỗ kết thúc: thay vì một dòng "Thuế GTGT 10%",
  # tờ này có một bảng nhỏ tổng hợp theo TỪNG thuế suất, vì hai dòng trên cùng
  # tờ hoá đơn có thể chịu hai mức thuế khác nhau. `summary: true` bật nó.
  #
  # `summary_rates` là các mức IN SẴN trên mẫu (0%, 5%, 10%) — hàng nào không
  # bán ở mức đó thì để trống chứ không bỏ dòng; `vat_rates` mới là mức thực
  # sự tính cho từng dòng hàng.

  - id: retail_vat_invoice
    weight: 2
    tags: [doc_invoice, has_vat, invoice_summary]
    params:
      profile: invoice
      invoice: true
      summary: true
      titles: ["HOÁ ĐƠN GIÁ TRỊ GIA TĂNG", "HOÁ ĐƠN GTGT"]
      num_items: [2, 7]
      price_step: 1000
      vat_rates: [5, 10]
      summary_rates: [0, 5, 10]
      item_vat: true
      show_form_no: true
      show_seller_account: true
      units: ["Cái", "Bộ", "Chiếc", "Kg", "Gói", "Thùng", "Hộp", "Lượt"]
      subtitle: "Bản thể hiện của hoá đơn điện tử"
      period_format: "Ngày (date) {date}"
      words_label: "Số tiền bằng chữ:"
      summary_labels:
        exempt: "Hàng hoá không chịu thuế GTGT:"
        taxed: "Hàng hoá chịu thuế suất:"
        total: "Tổng cộng tiền thanh toán:"
      banks:
        - "TMCP Đông Nam Á - CN Sở GD"
        - "Vietcombank - CN Hà Nội"
        - "Vietinbank - CN Đống Đa"
        - "Techcombank - CN Hoàn Kiếm"
        - "Agribank - CN Thăng Long"
      party_fields:
        left:
          - [buyer_name, "Tên người mua hàng:"]
          - [buyer_company, "Tên đơn vị:"]
          - [buyer_address, "Địa chỉ:"]
          - [buyer_tax_code, "Mã số thuế:"]
          - [buyer_account, "Số tài khoản:"]
          - [payment_form, "Hình thức thanh toán:"]
        right:
          - [security_code, "Số bảo mật:"]
          - [transaction_no, "Số giao dịch:"]
          - [bank_name, "Tại ngân hàng:"]
      payment_forms: ["Tiền mặt", "Chuyển khoản", "TM/CK"]
      signature_labels:
        - ["Người mua hàng", "(Ký, ghi rõ họ, tên)"]
        - ["Người bán hàng", "(Ký, ghi rõ họ, tên)"]
      digital_signature: true
      signed_at_label: "Ngày ký:"
      total_labels:
        subtotal: "Cộng tiền hàng chưa có thuế GTGT"

  # --------------------------------------------------------------------
  # HOÁ ĐƠN XUẤT KHẨU — tờ mẫu SONG NGỮ.
  #
  # Nhãn trường viết hai thứ tiếng ngay trên giấy: "Số vận đơn (Bill of lading
  # No.)". Đó là chuỗi IN LÊN GIẤY nên nằm ở đây, không phải ở code — và cũng
  # là lý do document này không dùng `lang: en`: corpus vẫn là tiếng Việt, chỉ
  # có nhãn là song ngữ.
  #
  # Hàng xuất khẩu chịu thuế suất 0%, nên tờ này KHÔNG có dòng thuế:
  # `show_vat: false` phủ quyết giá trị của thuộc tính content.

  - id: export_invoice
    weight: 2
    tags: [doc_invoice, doc_export]
    params:
      profile: export
      invoice: true
      show_vat: false
      show_subtotal: false
      titles: ["HOÁ ĐƠN XUẤT KHẨU (EXPORT INVOICE)"]
      num_items: [2, 6]
      price_step: 100
      qty_range: [120, 4800]
      show_form_no: true
      show_seller_account: true
      units: ["Chiếc (Pcs)", "Bộ (Set)", "Kg", "Thùng (Ctn)", "Đôi (Pair)", "Mét (M)"]
      subtitle: "Liên 1: Lưu (Copy 1 / Save)"
      period_format: "Ngày (Date) {date}"
      words_label: "Số tiền viết bằng chữ (Amount in words):"
      serial_format: "AA/{yy}P"
      banks:
        - "Ngân hàng IBK (Industrial Bank of Korea) CN TPHCM"
        - "Vietcombank - CN Đồng Nai"
        - "Shinhan Bank Việt Nam - CN Bình Dương"
        - "Woori Bank Việt Nam - CN Hà Nội"
      delivery_places:
        - "Cảng Cát Lái, TP.HCM"
        - "Cảng Hải Phòng"
        - "ICD Sóng Thần, Bình Dương"
        - "Cảng Cái Mép, Bà Rịa - Vũng Tàu"
        - "Sân bay Nội Bài, Hà Nội"
      destinations:
        - "Busan, Korea"
        - "Yokohama, Japan"
        - "Los Angeles, USA"
        - "Hamburg, Germany"
        - "Rotterdam, Netherlands"
        - "Sydney, Australia"
      transporters:
        - "Hãng tàu ONE"
        - "Maersk Line"
        - "Evergreen Marine"
        - "Công ty CP Giao nhận Vinatrans"
        - "Yusen Logistics Việt Nam"
      payment_forms: ["T/T", "L/C at sight", "D/P at sight", "T/T 30 ngày"]
      party_fields:
        strip:
          - [form_no, "Mẫu số (Form):"]
          - [serial, "Ký hiệu (Serial):"]
          - [number, "Số (Invoice No.):"]
        left:
          - [seller_name, "Tên đơn vị xuất khẩu (Exporter's name):"]
          - [seller_tax_code, "Mã số thuế (Tax code):"]
          - [seller_address, "Địa chỉ (Address):"]
          - [seller_unit, "Đơn vị phát hành (Issuing unit):"]
          - [seller_phone, "Điện thoại (Tel):"]
          - [seller_account, "Số tài khoản (Account No) (VND):"]
          - [seller_account_usd, "Số tài khoản (Account No) (USD):"]
          - [bank_name, "Tại Ngân Hàng (Bank name):"]
          - [buyer_company, "Tên đơn vị nhập khẩu (Importer's name):"]
          - [buyer_address, "Địa chỉ (Address):"]
          - [buyer_phone, "Điện thoại (Tel):"]
          - [payment_form, "Hình thức thanh toán (Payment method):"]
          - [buyer_account, "Số tài khoản (Bank Account):"]
          - [contract_no, "Số hợp đồng (Contract No):"]
          - [contract_date, "Ngày hợp đồng (Contract date):"]
        right:
          - [bill_of_lading, "Số vận đơn (Bill of lading No.):"]
          - [container_no, "Số Container (Container No.):"]
          - [place_of_delivery, "Địa điểm giao hàng (Place of delivery):"]
          - [place_of_destination, "Địa điểm nhận hàng (Place of destination):"]
          - [transporter, "Đơn vị vận chuyển (Transporter):"]
      notes:
        - "Tỉ giá (Rate): {exchange_rate}"
      signature_labels:
        - ["Người bán hàng (Seller)", "(Ký, đóng dấu, ghi rõ họ, tên - Sign, Stamp & Full name)"]
      total_labels:
        grand: "Cộng tiền hàng (Total amount)"

  # --------------------------------------------------------------------
  # HOÁ ĐƠN LƯU TRÚ — khách sạn, khu nghỉ dưỡng.
  #
  # `stay: true` đổi cách dựng dòng hàng: MỘT DÒNG MỘT ĐÊM, cùng một đơn giá,
  # kèm ngày của đêm đó và số phòng. Nhờ vậy phép tính trên giấy kiểm được —
  # bốn dòng giống hệt nhau và một tổng bằng bốn lần một dòng — và khối thông
  # tin đặt phòng phía trên nói đúng số đêm mà bảng phía dưới có.
  #
  # Không có dòng thuế (giá phòng đã gồm thuế và phí phục vụ, nói ở chân
  # trang), nhưng CÓ dòng đã thanh toán và dòng còn lại: khách trả tiền khi
  # trả phòng, và tờ giấy phải nói còn nợ bao nhiêu.

  - id: resort_stay
    weight: 2
    tags: [doc_invoice, doc_lodging, doc_service]
    params:
      profile: hotel
      invoice: true
      stay: true
      show_vat: false
      show_subtotal: false
      show_payment: true
      show_amount_words: false
      payment_groups: [qr, the]
      titles: ["HOÁ ĐƠN"]
      nights: [1, 4]
      extra_items: 2
      room_items: 5
      price_step: 1000
      serial_format: "INV00{n}"
      show_number: false
      show_seller_tax_code: false
      show_seller_website: true
      signature_names: true
      checkin_time: "14:00"
      checkout_time: "12:00"
      item_notes:
        - "Bao gồm bữa sáng"
        - "Không bao gồm bữa sáng"
        - "Đã bao gồm thuế và phí phục vụ"
      room_types:
        - "Phòng Deluxe hướng biển"
        - "Phòng Superior hướng thành phố"
        - "Phòng Suite gia đình"
        - "Phòng Studio ban công"
        - "Bungalow hướng vườn"
      booking_sources: ["Booking.com", "Agoda", "Traveloka", "Expedia", "Trực tiếp tại quầy"]
      party_fields:
        strip:
          - [serial, "Số hoá đơn:"]
          - [issued_at, "Ngày:"]
          - [booking_code, "Mã đặt phòng:"]
          - [channel_code, "Channel Code:"]
          - [booking_source, "Nguồn:"]
        left:
          - [buyer_name, "Khách hàng:"]
          - [checkin_date, "Ngày nhận phòng:"]
          - [checkout_date, "Ngày trả phòng:"]
          - [room_type, "Loại phòng:"]
        right:
          - [room_no, "Phòng:"]
          - [checkin_time, "Thời gian nhận phòng:"]
          - [checkout_time, "Thời gian trả phòng:"]
          - [nights, "Số đêm lưu trú:"]
      signature_labels:
        - ["Lễ tân", ""]
