# THUỘC TÍNH 5/10 — MÀU
#
# ink: màu mực chính (RGB). tint: ám màu phủ lên cả tờ giấy, kèm alpha.
# accent: màu riêng cho dòng tên cửa hàng / tiêu đề, để trống thì dùng `ink`.
#
# Máy in nhiệt và máy in kim chỉ có một màu, nên mọi giá trị nhiều màu ở đây
# đều `excludes: [thermal, impact]`. Đó cũng là lý do thuộc tính màu bốc SAU
# thuộc tính hình thức chứ không phải trước.

options:
  - id: mono_black
    weight: 5
    tags: [monochrome]
    params:
      ink: [26, 26, 26]
      tint: [255, 255, 255]
      tint_alpha: 0.0

  - id: faded_gray
    weight: 3
    tags: [monochrome, faded]
    params:
      ink: [92, 92, 96]
      tint: [250, 249, 244]
      tint_alpha: 0.10

  - id: thermal_yellow
    weight: 3
    tags: [monochrome, yellowed]
    params:
      ink: [40, 38, 34]
      tint: [246, 234, 200]
      tint_alpha: 0.28

  - id: blue_ink
    weight: 2
    excludes: [thermal, impact]
    tags: [multicolor]
    params:
      ink: [30, 30, 34]
      accent: [24, 62, 140]
      tint: [252, 252, 252]
      tint_alpha: 0.04

  - id: red_logo
    weight: 2
    excludes: [thermal, impact, ascii_only]
    tags: [multicolor, has_logo]
    params:
      ink: [28, 28, 28]
      accent: [176, 32, 38]
      tint: [255, 254, 252]
      tint_alpha: 0.03
