# THUỘC TÍNH 10/10 — TRỤC LĂN
#
# Dải NGANG, vuông góc với hướng giấy đi — trục lăn bẩn ép lên tờ giấy khi kéo
# nó qua máy. Khác `scan_banding` (trong chuỗi `augmentation`) ở hai chỗ đo
# được, và giữ cả hai vì đó là cách phân biệt hai loại hỏng trên bản scan thật:
# `scan_banding` là tổng hai sóng sin nên tuần hoàn đều, còn cái này là nhiễu
# trơn nên khoảng cách giữa hai dải không đoán trước được; và mặt cắt của nó đi
# qua một hàm gờ nên chỗ chuyển sáng-tối gấp khúc chứ không mượt.
#
# ĐANG TẮT, cùng với `toner` và `drum` -- đọc `toner.yaml` trước, nó giải
# thích vì sao "cái copier" là ba thuộc tính chứ không phải một, và tình trạng
# tắt hiện tại của cả ba.

