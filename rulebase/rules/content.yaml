# THUỘC TÍNH 3/6 — NỘI DUNG
#
# Chữ có dấu hay không, IN HOA hay không, tiền viết kiểu nào, có dòng thuế /
# dòng thanh toán / dòng khuyến mãi hay không.
#
# Corpus luôn lưu tiếng Việt CÓ DẤU; `prob_ascii_fold` mới là chỗ quyết định
# bỏ dấu lúc render. Bố cục `eatery_ascii` gắn thẻ `ascii_only`, nên mọi giá
# trị còn dấu ở đây đều phải `excludes: [ascii_only]` — nếu không sẽ sinh ra
# hoá đơn máy in 2011 mà lại có chữ "Phở".
#
# money_style: dot (56.000) | comma (20,200) | comma_2dp (33,600.00)

options:
  - id: diacritics_mixed
    weight: 3
    excludes: [ascii_only, doc_invoice]
    tags: [diacritics]
    params:
      money_style: dot
      prob_ascii_fold: 0.0
      prob_uppercase: 0.15
      show_subtotal: true
      show_payment: true
      num_footers: [1, 3]
      prob_item_discount: 0.10

  - id: diacritics_upper
    weight: 3
    excludes: [ascii_only, doc_invoice]
    tags: [diacritics]
    params:
      money_style: dot
      prob_ascii_fold: 0.0
      prob_uppercase: 0.85
      show_subtotal: true
      show_payment: true
      num_footers: [1, 3]
      prob_item_discount: 0.10

  - id: ascii_upper
    weight: 2
    excludes: [doc_invoice]
    tags: [no_diacritics]
    params:
      money_style: comma
      prob_ascii_fold: 1.0
      prob_uppercase: 1.0
      show_subtotal: false
      show_payment: false
      num_footers: [1, 2]
      prob_item_discount: 0.0

  - id: market_full
    weight: 3
    requires: [doc_market]
    excludes: [ascii_only, doc_invoice]
    tags: [diacritics]
    params:
      money_style: comma
      prob_ascii_fold: 0.0
      prob_uppercase: 0.55
      show_subtotal: true
      show_vat: true
      show_payment: true
      show_item_count: false
      num_footers: [2, 4]
      prob_item_discount: 0.30
      prob_weighed: 0.25

  - id: market_decimals
    weight: 3
    requires: [vat_rows]
    excludes: [ascii_only, doc_invoice]
    tags: [diacritics, two_decimals]
    params:
      money_style: comma_2dp
      prob_ascii_fold: 0.0
      prob_uppercase: 0.30
      show_subtotal: true
      show_vat: true
      show_payment: true
      show_item_count: true
      num_footers: [1, 3]
      prob_item_discount: 0.20
      prob_weighed: 0.15

  - id: dong_suffix
    weight: 1
    excludes: [ascii_only, two_decimals, doc_invoice]
    tags: [diacritics, currency_suffix]
    params:
      money_style: dot
      money_suffix: "đ"
      prob_ascii_fold: 0.0
      prob_uppercase: 0.4
      show_subtotal: true
      show_payment: true
      num_footers: [0, 2]
      prob_item_discount: 0.05

  # Nội dung cho hoá đơn GTGT. Khác giấy tính tiền ở ba chỗ: KHÔNG có dòng
  # "tiền khách trả / tiền trả lại" (hoá đơn ghi số phải trả, không ghi việc
  # trả tiền), luôn có dòng thuế, và không bao giờ có dòng khuyến mãi.
  - id: invoice_vi
    weight: 3
    requires: [doc_invoice]
    excludes: [lang_en]
    tags: [diacritics, invoice_text]
    params:
      money_style: dot
      prob_ascii_fold: 0.0
      prob_uppercase: 0.10
      show_subtotal: true
      show_vat: true
      show_payment: false
      num_footers: [1, 2]
      prob_item_discount: 0.0

  - id: invoice_vi_upper
    weight: 1
    requires: [doc_invoice]
    excludes: [lang_en]
    tags: [diacritics, invoice_text]
    params:
      money_style: dot
      prob_ascii_fold: 0.0
      prob_uppercase: 0.80
      show_subtotal: true
      show_vat: true
      show_payment: false
      num_footers: [1, 2]
      prob_item_discount: 0.0

  # Hoá đơn GTGT in kim những năm 2000: không dấu, in hoa, dấu phẩy ngăn nghìn.
  - id: invoice_ascii
    weight: 1
    requires: [doc_invoice]
    excludes: [lang_en]
    tags: [no_diacritics, invoice_text]
    params:
      money_style: comma
      prob_ascii_fold: 1.0
      prob_uppercase: 1.0
      show_subtotal: true
      show_vat: true
      show_payment: false
      num_footers: [1, 2]
      prob_item_discount: 0.0

  # Hoá đơn tiếng Anh: corpus lưu giá theo cent nên `cents` chia lại cho 100
  # lúc in, và ký hiệu tiền tệ đứng TRƯỚC con số chứ không đứng sau như "đ".
  - id: invoice_en
    weight: 2
    requires: [lang_en]
    tags: [no_diacritics, invoice_text]
    params:
      money_style: cents
      money_prefix: "$"
      prob_ascii_fold: 0.0
      prob_uppercase: 0.0
      show_subtotal: true
      show_vat: true
      show_payment: false
      num_footers: [1, 3]
      prob_item_discount: 0.0
