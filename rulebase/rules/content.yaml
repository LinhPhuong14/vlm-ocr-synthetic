# THUỘC TÍNH 3/6 — NỘI DUNG
#
# Chữ có dấu hay không, IN HOA hay không, tiền viết kiểu nào, có dòng thuế /
# dòng thanh toán / dòng khuyến mãi hay không.
#
# Corpus luôn lưu tiếng Việt CÓ DẤU; `prob_ascii_fold` mới là chỗ quyết định
# bỏ dấu lúc render. Bố cục `eatery_ascii` gắn thẻ `ascii_only`, nên mọi giá
# trị còn dấu ở đây đều phải `excludes: [ascii_only]` — nếu không sẽ sinh ra
# hoá đơn máy in 2011 mà lại có chữ "Phở".
#
# money_style: dot (56.000) | comma (20,200) | comma_2dp (33,600.00)

options:
  - id: diacritics_mixed
    weight: 3
    excludes: [ascii_only]
    tags: [diacritics]
    params:
      money_style: dot
      prob_ascii_fold: 0.0
      prob_uppercase: 0.15
      show_subtotal: true
      show_payment: true
      num_footers: [1, 3]
      prob_item_discount: 0.10

  - id: diacritics_upper
    weight: 3
    excludes: [ascii_only]
    tags: [diacritics]
    params:
      money_style: dot
      prob_ascii_fold: 0.0
      prob_uppercase: 0.85
      show_subtotal: true
      show_payment: true
      num_footers: [1, 3]
      prob_item_discount: 0.10

  - id: ascii_upper
    weight: 2
    tags: [no_diacritics]
    params:
      money_style: comma
      prob_ascii_fold: 1.0
      prob_uppercase: 1.0
      show_subtotal: false
      show_payment: false
      num_footers: [1, 2]
      prob_item_discount: 0.0

  - id: market_full
    weight: 3
    requires: [doc_market]
    excludes: [ascii_only]
    tags: [diacritics]
    params:
      money_style: comma
      prob_ascii_fold: 0.0
      prob_uppercase: 0.55
      show_subtotal: true
      show_vat: true
      show_payment: true
      show_item_count: false
      num_footers: [2, 4]
      prob_item_discount: 0.30
      prob_weighed: 0.25

  - id: market_decimals
    weight: 3
    requires: [vat_rows]
    excludes: [ascii_only]
    tags: [diacritics, two_decimals]
    params:
      money_style: comma_2dp
      prob_ascii_fold: 0.0
      prob_uppercase: 0.30
      show_subtotal: true
      show_vat: true
      show_payment: true
      show_item_count: true
      num_footers: [1, 3]
      prob_item_discount: 0.20
      prob_weighed: 0.15

  - id: dong_suffix
    weight: 1
    excludes: [ascii_only, two_decimals]
    tags: [diacritics, currency_suffix]
    params:
      money_style: dot
      money_suffix: "đ"
      prob_ascii_fold: 0.0
      prob_uppercase: 0.4
      show_subtotal: true
      show_payment: true
      num_footers: [0, 2]
      prob_item_discount: 0.05
