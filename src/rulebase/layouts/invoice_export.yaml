# Hoá đơn xuất khẩu — tờ mẫu SONG NGỮ.
#
# Dấu hiệu nhận biết: mọi nhãn trường in hai thứ tiếng, tiếng Anh trong ngoặc
# ngay sau tiếng Việt — "Số vận đơn (Bill of lading No.)"; KHÔNG có cột thuế
# suất nào cả (hàng xuất khẩu chịu 0%); dưới tiêu đề cột có dòng đánh số
# "(1) (2) ... (6 = 4 x 5)"; và cuối trang chỉ MỘT ô chữ ký — bên bán — vì
# người mua ở nước ngoài không ký vào tờ này.
#
# Khối bên bán KHÔNG phải letterhead mà là một khối trường như khối bên mua:
# trên tờ mẫu cả hai đều là dòng chấm có nhãn, xếp chồng nhau, và tên đơn vị
# xuất khẩu là giá trị của một trường chứ không phải một dòng tiêu đề. Vì thế
# `sections` ở đây không có `letterhead`, và khối "Mẫu số / Ký hiệu / Số" đi
# theo `strip` ngay dưới tiêu đề.
id: invoice_export
name: Export invoice — bilingual labels, stacked party blocks, one signature
source: "ảnh hoá đơn xuất khẩu mẫu 06HDXK3/001, ký hiệu AA/13P, của một doanh nghiệp FDI"

width: [100, 112]
gutter: 3
rule_char: "-"

# Kẻ bằng NÉT chứ không bằng ký tự — xem `invoice_vat_form.yaml`. Máy in kẻ tờ
# này, và một đường kẻ vẽ thật không tốn một dòng văn bản.

# Tờ rời A4 dọc. Khác giấy cuộn ở chỗ CHIỀU CAO ĐÃ ĐỊNH TRƯỚC khi in: một hoá
# đơn ba dòng hàng vẫn chiếm trọn tờ giấy, phần dưới là giấy trắng — đó là một
# phần diện mạo của tờ hoá đơn, không phải chỗ thừa để cắt đi.
sheet: a4

rules: marks

sections: [doctitle, strip, parties, table, notes, totals, words, signatures, footer]

doctitle:
  scale: [1.25, 1.45]

strip:
  separator: "|"
  rule_after: true

parties:
  # Xếp chồng: khối bên xuất khẩu hết bề ngang, rồi khối bên nhập khẩu dưới
  # nó — đúng tờ mẫu, và cũng là cách duy nhất dòng chấm dài ra đủ để nhìn
  # như giấy in sẵn.
  style: stacked
  leader: "."

column_header: true
column_header_bold: true
columns:
  - {key: stt,        title: "STT (No.)",                      width: 10,  align: center, title_align: center, number: "(1)"}
  - {key: name,       title: "Tên hàng hoá, dịch vụ (Description)", width: 0, align: left, title_align: center, number: "(2)"}
  - {key: unit,       title: "Đơn vị tính (Unit)",             width: 14, align: center, title_align: center, number: "(3)"}
  - {key: qty,        title: "Số lượng (Quantity)",            width: 13, align: right,  title_align: center, number: "(4)"}
  - {key: unit_price, title: "Đơn giá (Unit Price)",           width: 15, align: right,  title_align: center, number: "(5)"}
  - {key: amount,     title: "Thành tiền (Amount)",            width: 17, align: right,  title_align: center, number: "(6 = 4 x 5)"}

table:
  frame: true
  column_numbers: true
  row_rules: false
  blank_rows: 4

item:
  wrap_name: true
  rows:
    - - {col: stt, from: stt}
      - {col: name, from: name}
      - {col: unit, from: unit}
      - {col: qty, from: qty}
      - {col: unit_price, from: unit_price}
      - {col: amount, from: amount}

totals:
  frame: true
  emphasise_grand: true

words:
  frame: true

signatures:
  stamp_width: 44
  stamp_gap: 2

footer:
  rule_before: false
