name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floors in vlm_ocr_synthetic/compat.py exist because 3.14 needs
        # newer wheels than 3.10 does; both ends have to stay green.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[all]"

      - name: Install chromium
        run: playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Environment report
        run: python -m vlm_ocr_synthetic doctor

      - name: Test
        run: python -m pytest -q
