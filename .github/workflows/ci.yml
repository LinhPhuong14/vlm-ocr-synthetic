name: ci

# Data-layer checks only. No renderer environment is built: synthtiger pins
# pillow<10 while WeasyPrint needs a modern one, so the three cannot share an
# interpreter and installing them here would cost minutes to test code that
# never touches a pixel.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the ceiling synthtiger imposes on the glyph renderer, 3.13 is
        # ahead of it. rulebase/ has to work on both: it is imported by the
        # renderer venvs *and* by the tools, which run on whatever is around.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Deliberately nothing else. If a test ever needs numpy or opencv it has
      # stopped being a data-layer test, and this job is what says so.
      - run: python -m pip install --upgrade pip pytest pyyaml
      - run: python -m pytest

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # numpy and opencv are here only so `check-rules` can import
      # `degradation` and verify that every name in an augmentation chain
      # exists. Without them it reports the chains as unchecked -- which it
      # counts as a problem, correctly: "I could not look" is not "it is fine".
      - run: python -m pip install --upgrade pip pyyaml numpy "opencv-python-headless<5"
      - run: python tasks.py check-rules
      - run: python tasks.py check-corpus
      - run: python tasks.py check
