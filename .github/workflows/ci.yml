name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  compile:
    # Cheap guard: every tracked Python file must at least parse. Installing
    # synthtiger is not possible above 3.12 (see docs/python-314.md), so the
    # generators are not exercised here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: git ls-files '*.py' | grep -v '^generators/html-table/' | xargs -r python -m py_compile

  synthdog:
    # The one environment where synthtiger actually installs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r generators/synthdog/requirements.txt
      - name: Smoke test
        run: |
          python -c "import synthtiger, PIL, numpy, cv2; \
            print(synthtiger.__version__, PIL.__version__, numpy.__version__, cv2.__version__)"
          cd generators/synthdog && python -m py_compile template_receipt.py template.py
