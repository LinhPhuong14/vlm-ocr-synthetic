# SynthDoG-VN — hoá đơn bán lẻ Việt Nam, vẽ bằng glyph.
# synthtiger -o ./outputs/VNReceipt -c 100 -w 4 -v template_receipt.py SynthVNReceipt config_vi_receipt.yaml
#
# NỘI DUNG, BỐ CỤC, FONT, MÀU, LÀM CŨ đều nằm ở `rulebase/rules/*.yaml` —
# muốn đổi tỉ lệ hoá đơn siêu thị / quán nhậu, thêm bố cục, đổi chuỗi làm cũ
# thì sửa ở đó, không sửa file này. Ở đây chỉ còn phần riêng của renderer
# glyph: khung ảnh, độ cong giấy, và hiệu ứng "chụp lại" sau khi ghép nền.

quality: [50, 95]
short_size: [960, 1400]
canvas_fill: [0.70, 0.96]      # tờ hoá đơn chiếm bao nhiêu chiều cao khung ảnh
                               # (thấp hơn 0.7 thì chữ nhỏ tới mức OCR không đọc nổi)
canvas_aspect: [1.0, 1.9]      # cao / rộng của khung ảnh
label_format: parse            # 'parse' = gt_parse lồng nhau | 'text' = đọc trơn
seed_base: 0                   # đổi số này để chạy lại mà không trùng ảnh cũ

receipt:
  # Font chung của cả ba renderer. Font riêng (không phát hành lại được) để
  # trong `resources/font/<mono|sans>/` thì sẽ được ưu tiên hơn.
  font_root: ../../fonts
  local_font_root: resources/font
  margin_scale: [0.9, 1.15]    # nhân thêm vào `visual.margin` của recipe

background:
  image:
    paths: [resources/background]
    weights: [1]
  effect:
    args:
      # gaussian blur — nền mờ như chụp lấy nét vào tờ giấy
      - prob: 1
        args:
          sigma: [0, 10]

# cong giấy — biến dạng phi tuyến NHƯNG toạ độ vẫn map lại được
curl:
  prob: 0.85
  shift: [0.0, 0.030]
  squeeze: [0.0, 0.080]
  # `wave` lệch DỌC theo cột, nên nó là tham số duy nhất phá vỡ việc các ô
  # cùng một dòng nằm cùng một hàng: quá 0.004 thì cột tiền tụt xuống dòng
  # dưới so với cột tên hàng, và OCR đọc thành hai dòng khác nhau.
  wave: [0.0, 0.004]
  periods_y: [0.4, 2.0]
  periods_x: [0.3, 0.8]

# hiệu ứng mức tài liệu (áp lên chữ + giấy cùng lúc, TRƯỚC khi làm cũ)
doc_effect:
  args:
    # elastic distortion
    - prob: 1
      args:
        alpha: [0, 1]
        sigma: [0, 0.5]
    # gaussian noise
    - prob: 1
      args:
        scale: [0, 5]
        per_channel: 0
    # perspective
    - prob: 1
      args:
        percents: [[0.90, 1], [0.90, 1], [0.90, 1], [0.90, 1]]

# hiệu ứng mức toàn ảnh (sau khi ghép nền) — mô phỏng việc chụp lại tờ giấy
effect:
  args:
    # color
    - prob: 0.2
      args:
        rgb: [[0, 255], [0, 255], [0, 255]]
        alpha: [0, 0.2]
    # shadow
    - prob: 1
      args:
        intensity: [0, 110]
        amount: [0, 1]
        smoothing: [0.5, 1]
        bidirectional: 0
    # contrast
    - prob: 1
      args:
        alpha: [1.0, 1.3]
    # brightness
    - prob: 1
      args:
        beta: [-18, 0]
    # motion blur
    - prob: 0.3
      args:
        k: [3, 3]
        angle: [0, 360]
    # gaussian blur
    - prob: 1
      args:
        sigma: [0, 1.0]
