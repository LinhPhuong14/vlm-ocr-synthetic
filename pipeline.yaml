# One run, declared. `python pipeline/run.py` reads this file.
#
# Unknown keys are rejected rather than ignored: a config with `ouput:` in it
# that runs anyway, on the default, is exactly the silent failure this
# repository keeps getting bitten by.

run:
  out: data/run01
  per_backend: 20
  seed: 2026
  workers: auto          # auto = CPUs - 1, so the machine stays usable

  # paired       every backend draws the SAME receipts, so a difference between
  #              two renderers is a difference in drawing and nothing else.
  # independent  each backend gets its own seed block: three times the distinct
  #              pages, and no basis at all for comparing the renderers.
  #
  # Before W1b this was `independent` and nothing said so, which is why the
  # published proof numbers compared three different corpora. The mode is
  # written into manifest.json for the same reason.
  pairing: paired

  # Which layouts to draw from, by name. Empty (the default) means every file in
  # `rulebase/layouts/`, which is what a dataset wants. A *fixed comparison*
  # should name them: the quota walks the list in order, so a run that took the
  # directory draws a different set the day someone adds a layout. That is how
  # the golden baseline went red without being able to say why -- see
  # `tools/baseline.py`, whose plans all name theirs.
  layouts: []

# `html` is the renderer. `genalog` and `synthdog` are retired from dataset
# generation and naming either here is an error with the reason attached --
# see pipeline/config.py and docs/renderers.md.
backends: [html]

shard:
  # Images per shard. Too small and subprocess and browser startup dominate;
  # too large and a kill loses more work and the load spreads unevenly.
  #
  # At the cost of a page measured by `tools/profile_pipeline.py` -- html 1.4s
  # under the conditions that file records -- 100 to 250 puts a shard in the
  # two-to-ten-minute band resume is designed for. (The same file records
  # synthdog at 3.1s and genalog at 0.9s; both are retired, and the numbers are
  # kept only because the band was chosen against them.) The numbers here were re-measured from scratch rather than carried
  # forward: the previous ones predated the `sample_recipe` fix, and comparing
  # a new measurement with an old one taken over a different layout and ageing
  # mix credits whatever changed in between with the difference.
  #
  # The fixed cost a shard pays ONCE -- interpreter plus backend start-up -- is
  # 0.7s for html, most of it launching Chromium. Once, since W3b: a shard is one renderer process whatever its
  # layout count. It used to be one process per layout, so a 20-image shard
  # over 14 layouts paid that cost 14 times and drew 1.43 images per process.
  # Fixing it cut the same plan from 140s to 98s, a third of the run, without
  # changing an html or genalog pixel.
  size: 100

# Re-weight a value for this run only, without editing rules/. Every entry must
# name something that exists; one that does not stops the run rather than
# quietly leaving the weights alone.
overrides: {}

quality:
  # How far a shard's mix may sit from the mix the plan asked for, measured as
  # total variation distance. In words:
  #
  #   0.15 means at most 15% of a shard's draws would have to be moved from one
  #   value to another to turn what was drawn into what was expected -- OVER AND
  #   ABOVE what a sample that size scatters by anyway.
  #
  # The second clause is the load-bearing one. Forty draws over eleven
  # augmentation values land about 0.19 from their own weights by chance, so a
  # tolerance read as a flat ceiling warns on runs that have not drifted; the
  # first real run it was tried on warned at 0.17 with nothing wrong. The
  # scatter is computed per attribute and per shard and printed in the warning,
  # so this number keeps one meaning whether a shard holds 40 draws or 4000.
  #
  # Raising it is a decision about what size of drift is acceptable, not a way
  # to quieten a noisy run -- the noise is already accounted for.
  drift_tolerance: 0.15
  # Reserved for the OCR sampling wave; read and carried, not yet used.
  sample_for_ocr: 500
