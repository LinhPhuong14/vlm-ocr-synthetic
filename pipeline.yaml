# One run, declared. `python pipeline/run.py` reads this file.
#
# Unknown keys are rejected rather than ignored: a config with `ouput:` in it
# that runs anyway, on the default, is exactly the silent failure this
# repository keeps getting bitten by.

run:
  out: data/run01
  per_backend: 20
  seed: 2026
  workers: auto          # auto = CPUs - 1, so the machine stays usable

  # paired       every backend draws the SAME receipts, so a difference between
  #              two renderers is a difference in drawing and nothing else.
  # independent  each backend gets its own seed block: three times the distinct
  #              pages, and no basis at all for comparing the renderers.
  #
  # Before W1b this was `independent` and nothing said so, which is why the
  # published proof numbers compared three different corpora. The mode is
  # written into manifest.json for the same reason.
  pairing: paired

backends: [synthdog, html, genalog]

shard:
  # Images per shard. Too small and subprocess and browser startup dominate;
  # too large and a kill loses more work and the load spreads unevenly. At the
  # measured cost of a page -- synthdog 1.6s, html 1.2s, genalog 0.7s -- 100 to
  # 250 puts a shard in the one-to-five-minute band that resume is designed for.
  size: 100

# Which slice of the document hierarchy this run covers, and how it is balanced
# between the types in it. Leave the section out entirely -- as it is here -- and
# the run splits its images over the LAYOUTS exactly as every run did before
# `taxonomy/` existed, which is what the golden baseline pins.
#
#   include   subtrees or single types; everything, if omitted
#   exclude   subtrees or single types to drop again
#   balance   family  every family gets the same budget, split evenly inside it.
#                     The default: sixteen types under family 1 and six under
#                     family 11 is how the tree was drawn, not how common the
#                     documents are.
#             equal   every TYPE gets the same number
#             weight  the mix the rules already describe, scaled up
#
# A type in the selected subtree that nothing can generate yet is dropped and
# named. A type named directly that cannot be generated stops the run.
#
# taxonomy:
#   include: [business.receipt]
#   exclude: []
#   balance: family

# Re-weight a value for this run only, without editing rules/. Every entry must
# name something that exists; one that does not stops the run rather than
# quietly leaving the weights alone.
overrides: {}

# Read and carried, unused until W2. Declared now so pipeline.yaml does not
# change shape between waves.
quality:
  drift_tolerance: 0.15
  sample_for_ocr: 500
