  tags:
  - dressed_free
  requires:
  - aug_free
  params:
    label: giấy xám nhạt, nét mực đen, tiêu đề không nền, không sọc, chữ không chân,
      cột số kiểu máy in, nén dòng, nền hoa văn chìm
    level: free
    axes:
      stock: xam
      rule: muc_den
      band: trong
      zebra: khong
      type: so_may
      density: nen
      mark: guilloche
    css: '#sheet{background:#f6f6f4;}

      #sheet table.items th,#sheet table.items td{border-width:.3mm;border-color:#1c1c1c;}

      #sheet table.items th{background:transparent;}

      #sheet{font-family:''DejaVuSans'',''LiberationSans'',''DejaVu Sans'',sans-serif;}

      #sheet td.r,#sheet th.r{font-family:''LiberationMono'',''Cousine'',monospace;letter-spacing:-.1pt;}

      #sheet table.items th,#sheet table.items td{padding:.55mm .9mm;}

      #sheet{line-height:1.18;}

      #sheet::before{content:'''';position:absolute;z-index:-1;pointer-events:none;left:0;right:0;top:0;bottom:0;opacity:.055;background:repeating-linear-gradient(38deg,#20406b
      0 .5mm,transparent .5mm 2.6mm),repeating-linear-gradient(-38deg,#20406b 0 .5mm,transparent
      .5mm 2.6mm);}'
