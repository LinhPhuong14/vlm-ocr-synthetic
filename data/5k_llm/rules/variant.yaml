- id: f_xanh_lam_manh_trong_khong_so_may_chuan_goc_vuong_nguyen_phoi
  weight: 2.5
  tags:
  - dressed_free
  requires:
  - aug_free
  params:
    label: liên xanh lam, nét mảnh, tiêu đề không nền, không sọc, chữ không chân,
      cột số kiểu máy in, dòng chuẩn, nẹp góc trên phải, giữ nguyên phôi
    level: free
    axes:
      stock: xanh_lam
      rule: manh
      band: trong
      zebra: khong
      type: so_may
      density: chuan
      mark: goc_vuong
      structure: nguyen_phoi
    css: '#sheet{background:#f3f7fc;}

      #sheet table.items th,#sheet table.items td{border-width:.18mm;}

      #sheet table.items th{background:transparent;}

      #sheet{font-family:''DejaVuSans'',''LiberationSans'',''DejaVu Sans'',sans-serif;}

      #sheet td.r,#sheet th.r{font-family:''LiberationMono'',''Cousine'',monospace;letter-spacing:-.1pt;}

      #sheet table.items th,#sheet table.items td{padding:1mm 1.2mm;}

      #sheet{line-height:1.3;}

      #sheet::before{content:'''';position:absolute;z-index:-1;pointer-events:none;right:4mm;top:4mm;width:16mm;height:16mm;border-top:.8mm
      solid #b4482f;border-right:.8mm solid #b4482f;}'
    moves: []
- id: f_xanh_luc_manh_xam_dam_xam_hien_dai_thoang_vach_gay_khong_khung_bang_hep
  weight: 2.5
  tags:
  - dressed_free
  requires:
  - aug_free
  params:
    label: liên xanh lục, nét mảnh, tiêu đề nền xám đậm, sọc xám, chữ không chân,
      dòng thoáng, vạch gáy trái, bỏ khung ngoài, bảng không hết bề ngang
    level: free
    axes:
      stock: xanh_luc
      rule: manh
      band: xam_dam
      zebra: xam
      type: hien_dai
      density: thoang
      mark: vach_gay
      structure: khong_khung_bang_hep
    css: '#sheet{background:#f2faf4;}

      #sheet table.items th,#sheet table.items td{border-width:.18mm;}

      #sheet table.items th{background:#d8d8d5;}

      #sheet table.items tr:nth-child(even) td{background:#f2f2f0;}

      #sheet{font-family:''DejaVuSans'',''LiberationSans'',''DejaVu Sans'',sans-serif;}

      #sheet table.items th,#sheet table.items td{padding:1.5mm 1.7mm;}

      #sheet{line-height:1.42;}

      #sheet::before{content:'''';position:absolute;z-index:-1;pointer-events:none;left:0;top:0;bottom:0;width:3.2mm;background:linear-gradient(90deg,#2f5d8a,#2f5d8a55);}

      #sheet .frame{border:0;padding:0;}

      #sheet .inner{border:0;}

      #sheet table.items{width:88%;margin-left:auto;margin-right:auto;}'
    moves: []
