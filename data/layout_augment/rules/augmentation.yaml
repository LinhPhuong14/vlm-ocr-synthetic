options:
- id: pristine
  weight: 2.0
  tags:
  - clean
  params:
    chain: []
- id: real_paper
  weight: 4.0
  tags:
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.35
        grain: 0.5
    - - paper_overlay
      - alpha: 0.28
        lighten: 0.3
- id: light
  weight: 4.0
  tags:
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.3
        grain: 0.4
    - - blur_zones
      - radius: 0.9
        zones: 1
        coverage: 0.12
- id: medium
  weight: 4.0
  tags:
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.4
        grain: 0.6
    - - blur_zones
      - radius: 1.1
        zones: 2
        coverage: 0.15
    - - shadow_binding
      - border: bottom
        distance_ratio: 0.1
        intensity: 0.35
    - - paper_overlay
      - alpha: 0.3
        lighten: 0.35
- id: heavy
  weight: 2.0
  tags:
  - dirty
  - textured
  excludes:
  - thermal
  params:
    chain:
    - - paper_texture
      - alpha: 0.45
        grain: 0.7
    - - bleed_through
      - intensity: 0.5
        nb_iter: 6
    - - blur_zones
      - radius: 1.4
        zones: 3
        coverage: 0.18
    - - shadow_binding
      - border: left
        distance_ratio: 0.13
        intensity: 0.45
- id: stains
  weight: 3.0
  tags:
  - dirty
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.35
        grain: 0.5
    - - gradient_domain
      - count: 5
        strength: 0.75
- id: crumpled
  weight: 2.0
  tags:
  - creased
  - textured
  requires:
  - thermal
  params:
    chain:
    - - paper_texture
      - alpha: 0.5
        grain: 0.8
        creases: 4
    - - gradient_domain
      - count: 3
        strength: 0.6
    - - blur_zones
      - radius: 1.2
        zones: 3
        coverage: 0.18
    - - paper_overlay
      - alpha: 0.34
        lighten: 0.3
- id: torn_edges
  weight: 2.0
  tags:
  - textured
  - torn
  params:
    chain:
    - - paper_texture
      - alpha: 0.4
        grain: 0.6
        creases: 2
    - - holes
      - count: 2
        placement: border
        size_ratio: 0.16
        fill: black
    - - holes
      - count: 1
        placement: corner
        size_ratio: 0.26
        fill: black
    - - blur_zones
      - radius: 1.0
        zones: 2
        coverage: 0.14
- id: punched
  weight: 1.0
  tags:
  - textured
  - torn
  params:
    chain:
    - - paper_texture
      - alpha: 0.45
        grain: 0.7
    - - holes
      - count: 3
        placement: center
        size_ratio: 0.09
        fill: black
    - - shadow_binding
      - border: left
        distance_ratio: 0.1
        intensity: 0.35
- id: ghost_text
  weight: 3.0
  tags:
  - ghosting
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.3
        grain: 0.45
    - - phantom_character
      - frequency: rare
    - - blur_zones
      - radius: 1.2
        zones: 2
        coverage: 0.15
- id: photocopy
  weight: 3.0
  tags:
  - high_contrast
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.25
        grain: 0.35
    - - phantom_character
      - frequency: rare
    - - blur
      - radius: 0.8
    - - shadow_binding
      - border: top
        distance_ratio: 0.08
        intensity: 0.3
    - - paper_overlay
      - alpha: 0.22
        lighten: 0.4
- id: photocopy_screened
  weight: 3.0
  tags:
  - screened
  - textured
  excludes:
  - thermal
  params:
    chain:
    - - paper_texture
      - alpha: 0.28
        grain: 0.4
    - - halftone_screen
      - cell: 4.2
        angle: 45
        strength: 0.5
    - - blur
      - radius: 0.6
    - - scan_banding
      - period: 46
        amplitude: 0.045
- id: photocopy_stamped
  weight: 2.0
  tags:
  - screened
  - textured
  excludes:
  - thermal
  params:
    chain:
    - - paper_texture
      - alpha: 0.3
        grain: 0.45
    - - halftone_screen
      - cell: 3.6
        angle: 45
        strength: 0.7
    - - blur
      - radius: 0.7
    - - pattern_overlay
      - pattern: seal_square_copy
        scale: 0.34
        opacity: 0.55
        anchor: bottom_right
        rotate: 8
    - - scan_banding
      - period: 34
        amplitude: 0.06
- id: flatbed_scan
  weight: 3.0
  tags:
  - scanned
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.24
        grain: 0.35
    - - scan_banding
      - period: 30
        amplitude: 0.07
        tilt: 1.5
    - - blur_zones
      - radius: 1.1
        zones: 2
        coverage: 0.16
    - - jpeg_blocks
      - quality: 42
        passes: 1
- id: forwarded_photo
  weight: 3.0
  tags:
  - recompressed
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.3
        grain: 0.5
    - - blur_zones
      - radius: 1.4
        zones: 2
        coverage: 0.2
    - - jpeg_blocks
      - quality: 30
        passes: 3
- id: impact_ribbon
  weight: 2.0
  tags:
  - dot_printed
  - textured
  requires:
  - impact
  params:
    chain:
    - - paper_texture
      - alpha: 0.32
        grain: 0.5
    - - dot_matrix
      - cell: 2.8
        shape: circle
        coverage: 0.78
        strength: 0.8
        dead_pins: 2
        ribbon: 0.25
    - - blur
      - radius: 0.5
    - - scan_banding
      - period: 42
        amplitude: 0.04
- id: worn_plate
  weight: 2.0
  tags:
  - hollowed
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.3
        grain: 0.45
    - - letterpress
      - clusters: 260
        spread: 5.0
        dots: 14
        strength: 0.65
    - - by_box
      - effect: hollow
        params:
          strength: 0.8
        select:
          policy: run
          fraction: 0.18
    - - blur_zones
      - radius: 1.0
        zones: 2
        coverage: 0.14
- id: annotated
  weight: 2.0
  tags:
  - annotated
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.28
        grain: 0.4
    - - paper_overlay
      - alpha: 0.26
        lighten: 0.32
    - - by_box
      - effect: markup
        params:
          style: highlight
          opacity: 0.7
        select:
          policy: run
          fraction: 0.08
    - - by_box
      - effect: markup
        params:
          style: circle
          colour: red
        select:
          policy: kind
          kinds:
          - total
          fraction: 0.6
    - - blur_zones
      - radius: 1.0
        zones: 1
        coverage: 0.12
- id: scribbled
  weight: 3.0
  tags:
  - annotated
  - dirty
  - textured
  params:
    chain:
    - - paper_texture
      - alpha: 0.34
        grain: 0.5
    - - by_box
      - effect: markup
        params:
          style: crossed_off
          colour: blue
        select:
          policy: scatter
          count: 1
    - - by_box
      - effect: scribbles
        params:
          turns: 8
          opacity: 0.75
        select:
          policy: scatter
          count: 2
    - - blur_zones
      - radius: 1.2
        zones: 2
        coverage: 0.16
- id: security_paper
  weight: 1.0
  tags:
  - patterned
  - textured
  requires:
  - doc_invoice
  params:
    chain:
    - - paper_texture
      - alpha: 0.22
        grain: 0.3
    - - voronoi_tessellation
      - scale: 30
        alpha: 0.15
        contrast: 0.6
        edges: 0.08
    - - blur_zones
      - radius: 1.0
        zones: 2
        coverage: 0.14
- id: security_guilloche
  weight: 1.0
  tags:
  - patterned
  - textured
  requires:
  - doc_invoice
  params:
    chain:
    - - paper_texture
      - alpha: 0.22
        grain: 0.3
    - - paper_overlay
      - alpha: 0.24
        lighten: 0.34
    - - delaunay_tessellation
      - scale: 42
        alpha: 0.13
        contrast: 0.5
- id: screen_photo
  weight: 2.0
  tags:
  - misregistered
  - recompressed
  - textured
  excludes:
  - thermal
  params:
    chain:
    - - paper_texture
      - alpha: 0.18
        grain: 0.25
    - - color_shift
      - shift: 1.3
        blur: 0.4
    - - glitch_effect
      - bands: 4
        max_shift: 0.003
        separation: 0.6
    - - scan_banding
      - period: 22
        amplitude: 0.05
    - - jpeg_blocks
      - quality: 34
        passes: 2
- id: misregistered
  weight: 1.0
  tags:
  - misregistered
  - textured
  excludes:
  - thermal
  params:
    chain:
    - - paper_texture
      - alpha: 0.3
        grain: 0.45
    - - paper_overlay
      - alpha: 0.28
        lighten: 0.3
    - - color_shift
      - shift: 2.0
        radial: 1.0
        blur: 0.5
    - - blur_zones
      - radius: 1.2
        zones: 2
        coverage: 0.16
