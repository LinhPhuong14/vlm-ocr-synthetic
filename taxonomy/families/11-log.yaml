# 11. LOG / OPERATIONAL DOCUMENT
#
# Timestamped rows, monospaced, often printed by the machine that produced them.
# Mechanically the easiest family in the tree for the grid engine -- and the one
# where the ageing effects matter most, since these are the pages that live in a
# workshop and get photographed on a clipboard.

