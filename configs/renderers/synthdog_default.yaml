# Pillow backend: python -m vlm_ocr_synthetic render -c configs/synthdog_default.yaml
renderer: synthdog

scale: 1.0
seed: 42

font_size: 22
title_font_size: 40
margin: 60
line_spacing: 1.35

text_color: [25, 25, 28]
draw_table_grid: true

# Shared with the html backend, so both look like the same scanner.
paper:
  enabled: true
  color: [250, 249, 245]
  grain: 4.0
