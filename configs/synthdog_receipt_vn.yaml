# The same receipt through the Pillow rasteriser, for side-by-side checks.
#   python -m vlm_ocr_synthetic render -c configs/synthdog_receipt_vn.yaml -s receipt_vn
renderer: synthdog

scale: 1.0
seed: 42

font_path: /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
bold_font_path: /usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf

font_size: 17
section_font_size: 24
footnote_font_size: 18

margin: 34
line_spacing: 1.4
block_spacing: 12
cell_padding: 2

text_color: [20, 20, 20]
draw_table_grid: false
underline_headers: false
center_block_types: ["Page-Header", "Section-header", "Footnote"]

# No table_column_widths here on purpose: the document carries the column
# layout, so synthdog and html lay the same bill out the same way.

paper:
  enabled: true
  color: [243, 242, 238]
  grain: 6.0
  blur: 0.35
  pepper: 0.0008
  # A bill gets folded once on the way into a pocket.
  fold_rows: 1
  fold_strength: 0.4
  fold_softness: 4.0
  vignette: 0.18
