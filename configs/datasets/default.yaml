# A dataset run. Variants are declared in Python (vlm_ocr_synthetic/variations/);
# this file only decides how often each one is picked.
#
#   python -m vlm_ocr_synthetic generate -c configs/dataset.yaml --dry-run
#   python -m vlm_ocr_synthetic generate -c configs/dataset.yaml -o data/dataset

pages: 200
seed: 1234
scale: 1.0

# "sample"     -- independent draws, weights respected, rare combos may be missed
# "stratified" -- walk every compatible combination before repeating one
mode: sample

# Each page is laid out once and aged this many ways. Extra ageings reuse the
# structural render, so they cost almost nothing.
degradations_per_page: 2

image_format: png     # jpeg keeps a big dataset on disk; png is lossless
jpeg_quality: 88

# Weights are relative, not probabilities: 5 is picked 5x as often as 1.
# Set a weight to 0 to switch a variant off without deleting it.
axes:
  layout:
    receipt_80mm: 5
    receipt_80mm_short: 2
    receipt_80mm_long: 2
    receipt_80mm_minimal: 2
    receipt_80mm_with_change: 2
    receipt_80mm_en: 1
    receipt_58mm: 3
    receipt_58mm_long: 1
    invoice_a4: 3
    invoice_a4_flow: 2

  backend:
    synthdog: 3
    html-flow: 4
    html-absolute: 1

  style:
    thermal_17: 5
    thermal_15_tight: 3
    thermal_19_airy: 2
    thermal_faint: 2
    thermal_bold_header: 2
    thermal_wide_line: 2
    thermal_13_dense: 2
    thermal_sans: 2
    thermal_ruled: 1
    thermal_20_large: 1
    office_sans_22: 4
    office_sans_18_tight: 2
    office_serif_22: 3
    office_mono_20: 1
    office_borderless: 2

  degradation:
    clean: 3
    light_scan: 5
    office_copier: 4
    photocopy_dark: 2
    sun_faded: 2
    bleed_back: 2
    folded_once: 3
    pocket_worn: 2
    folded_quarter: 2
    trifold_mailed: 2
