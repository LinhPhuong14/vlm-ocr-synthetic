# 80mm thermal receipt, Vietnamese restaurant bill.
#   python -m vlm_ocr_synthetic render -c configs/html_receipt_vn.yaml -s receipt_vn
renderer: html

scale: 1.0
seed: 42

engine: playwright
layout: flow

font_family: "DejaVu Sans Mono, Liberation Mono, monospace"
font_size: 17
header_font_size: 24
footnote_font_size: 18
line_height: 1.4

margin: 34
block_spacing: 12
cell_padding: 2

text_color: "#141414"

# The paper bill has no rules: centred shop block, bare item table,
# right-aligned prices.
table_border: "none"
extra_css: |
  .block-Page-Header,
  .block-Section-header,
  .block-Footnote { text-align: center; }
  .block-Page-Header { letter-spacing: 1px; }
  .block-Text:nth-of-type(-n+4) { text-align: center; }
  td, th { padding: 1px 2px; }
  /* STT | Tên hàng | SL | Đơn giá | Thành tiền */
  td:nth-child(1), th:nth-child(1) { width: 2.2em; text-align: center; }
  td:nth-child(3), th:nth-child(3) { width: 2.4em; text-align: center; }
  td:nth-child(4), th:nth-child(4),
  td:nth-child(5), th:nth-child(5) { text-align: right; white-space: nowrap; }
  th { background: transparent; border-bottom: 1px dashed #4a4a4a; }

# Thermal paper: greyer, grainier, and the print head is never crisp.
paper:
  enabled: true
  color: [243, 242, 238]
  grain: 6.0
  blur: 0.35
  pepper: 0.0008
  vignette: 0.18
